.bgveil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,253,240,.55),rgba(255,253,240,.25) 30%,rgba(255,253,240,.25) 70%,rgba(255,253,240,.55))}
h1,h2{font-family:var(--fh);font-weight:600;margin:0;text-wrap:balance;color:var(--title)}
h1{font-size:28px;line-height:1.2}
header.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:60px;z-index:50;background:rgba(255,253,240,.96);border-bottom:.67px solid var(--line);display:flex;align-items:center;gap:8px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;font-family:var(--fh);font-weight:600;font-size:16px;color:var(--navy);padding:0;white-space:nowrap}
.brand .p{width:32px;height:32px;border-radius:9px;background:var(--wine);color:#fffdf0;display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:17px;flex:none}
nav.main{display:flex;gap:4px;margin-left:16px}
nav.main a{padding:8px 12px;border-radius:9999px;color:var(--navy);font:500 14px var(--fb);cursor:pointer;text-decoration:none}
nav.main a:hover{background:var(--field)} nav.main a.on{background:var(--sage-bg)}
.spacer{flex:1}
.seal{width:34px;height:34px;border-radius:50%;background:var(--terra);color:#fffdf0;display:grid;place-items:center;font-family:"Georgia",serif;font-style:italic;font-size:17px;flex:none}
.estab{height:36px;border-radius:9999px;background:var(--sage-bg);border:0;color:var(--navy);font:500 14px var(--fb);padding:0 14px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.avbtn{display:flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--navy);padding:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:13px;background:var(--terra-bg);color:var(--terra);flex:none}
.av.me{background:var(--navy);color:#fffdf0}
.hamb{display:none;background:none;border:0;color:var(--navy);font-size:22px;cursor:pointer;padding:6px 4px;flex:none;margin-right:-4px}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-block:88px 28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border-radius:25px;padding:24px;border:.67px solid var(--line)}
.card+.card{margin-top:16px}
.sub{color:var(--grey);font-size:15px;margin:4px 0 0}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;padding-bottom:16px;border-bottom:.67px solid var(--line);margin-bottom:20px}
.crumb{font-size:12px;color:var(--grey);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:9999px;border:0;background:var(--navy);color:#fffdf0;font:500 15px/1.2 var(--fb);cursor:pointer;text-decoration:none;text-align:center;max-width:100%}
.btn.sec{background:var(--field);color:var(--navy)}
.btn.sm{min-height:32px;padding:5px 14px}
.btn.outl{background:#fff;border:.67px solid var(--line);color:var(--navy)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.lbl{font:500 14px var(--fb);color:var(--navy);display:block;margin-bottom:6px}
.field{display:flex;flex-direction:column;min-width:0}
select,input[type=search],input[type=text],input[type=password],input[type=date],input[type=month],textarea{height:36px;border-radius:9999px;border:0;background:var(--field);color:var(--ink);font:400 16px var(--fb);padding:0 14px;width:100%;min-width:0}
textarea{height:auto;min-height:80px;border-radius:16px;padding:10px 14px;resize:vertical}
select{appearance:none;padding-right:34px}
.sel{position:relative}.sel::after{content:"⌄";position:absolute;right:14px;top:50%;transform:translateY(-60%);pointer-events:none;color:var(--navy)}
.search{position:relative}.search input{padding-left:36px}.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.band{background:var(--field);border-radius:9999px;padding:8px 16px;font-size:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:16px 0}
.band b{font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.d-or{background:var(--orange)}.d-bl{background:var(--navy)}.d-gr{background:var(--sage)}.d-gy{background:#b9bdb3}.d-rd{background:var(--terra)}
.switch{display:inline-flex;background:var(--field);border-radius:9999px;padding:3px;gap:2px;height:36px}
.switch button{border:0;background:transparent;border-radius:9999px;padding:0 14px;color:var(--navy);font:500 14px var(--fb);cursor:pointer;display:flex;align-items:center;gap:6px}
.switch button.on{background:#fff}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--field);color:var(--navy);cursor:pointer;font-size:15px;display:grid;place-items:center;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--grey);font-size:14px}
.ico-round{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
em.e{font-style:italic;color:var(--navy)}
.kpi{position:relative;background:#fff;border:.67px solid var(--line);border-radius:25px;padding:24px}
.kpi .t{font:500 15px var(--fb);color:var(--navy)}.kpi .ic{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;background:var(--sage-bg);display:grid;place-items:center;font-size:16px}
.kpi .v{font:700 28px var(--fh);margin-top:12px;color:var(--navy)}.kpi .c{font-size:12px;color:var(--grey);margin-top:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.mtag{border-radius:10px;padding:6px 14px;font-weight:500;color:#fff;background:#e6cfc3}.mtag.cur{background:var(--terra)}
.mval{color:var(--terra);font-weight:500}.mval.p{color:#c9a08e}
.greybox{background:var(--sage-bg);border-radius:20px;min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--navy);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:3px 10px;font-size:12px;background:var(--field);color:var(--navy);white-space:nowrap}
.pill.green{background:var(--sage-bg);color:var(--green)}.pill.red{background:var(--terra-bg);color:var(--terra)}.pill.orange{background:#f6e9d9;color:var(--orange)}.pill.blue{background:var(--sage-bg);color:var(--navy)}
.fmt{display:flex;gap:16px;background:#fff;border:.67px solid var(--line);border-radius:25px;padding:16px;align-items:center;flex-wrap:wrap}
.fmt .ph{width:120px;height:120px;border-radius:20px;flex:none;display:grid;place-items:center;font-size:40px}
.fmt .ph.business{background:linear-gradient(135deg,var(--sage),var(--navy))}.fmt .ph.famille{background:linear-gradient(135deg,#e6cfc3,var(--terra))}.fmt .ph.couple{background:linear-gradient(135deg,#c9b9a0,var(--wine))}
.fmt .body{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.fmt .ttl{font:600 18px var(--fh);color:var(--navy)}.fmt .m1{font-size:13px;color:var(--grey)}
.fmt .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sec-head{display:flex;justify-content:space-between;align-items:center;border:.67px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:8px 14px;margin:20px 0 12px;font:500 15px var(--fb);color:var(--navy)}
.q{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;background:#fff;border:.67px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.q .num{width:32px;height:32px;border-radius:50%;background:var(--sage-bg);display:grid;place-items:center;font-size:13px;color:var(--navy);font-weight:500}

const stdsFor=(format,channel,hotel)=>STANDARDS.filter(s=>(!s.scen||s.scen===format)&&(!s.chan||s.chan===channel)&&(!s.hotels||!hotel||s.hotels.includes(hotel)));
const RICH=s=>['R','S','A'].includes(s.t);
/* Réponse complète ? Une critique ratée exige une photo (point de vigilance de la présentation). */
function ansOk(s,v,photo){if(v==null||v==='')return false;
 if(RICH(s)){if(s.k==='choice')return !!v.c;if(s.k==='sub')return SUBCRIT.every(c=>v.crit&&v.crit[c]);if(['title','pos','neg','text'].includes(s.k))return !!(v.txt&&v.txt.trim());return v.n!=null}
 if(s.t==='C'&&v==='non')return !!photo;return true}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const rnd=x=>x==null?null:Math.round(x);
/* Barème : section = points obtenus / possibles (Sans objet exclu), un bonus factuel par section, plafonné à 100 %.
   Note globale = moyenne des 5 sections − 3 par critique ratée. Ressenti, marque, upselling, digital, avis : indicateurs à part. */
function computeScore(format,channel,answers,comments,hotel){answers=answers||{};comments=comments||{};
 const list=stdsFor(format,channel,hotel);const sec={},secR={};const crit=[],bonus=[],rs=[];let essOk=0,essN=0;
 SECTIONS.forEach(s=>{sec[s]={got:0,pos:0,bonus:0};secR[s]=[]});
 list.forEach(s=>{const v=answers[s.id];
  if(s.t==='R'){if(v&&v.n){rs.push(+v.n);if(secR[s.sec])secR[s.sec].push(+v.n)}return}
  if(s.t==='X'){if(v==='oui'&&String(comments[s.id]||'').trim()){sec[s.sec].bonus=1;bonus.push(s)}return}
  if(!PTS[s.t]||!v||v==='na')return;
  const p=PTS[s.t];sec[s.sec].pos+=p;if(v==='oui')sec[s.sec].got+=p;else if(s.t==='C')crit.push(s);
  if(s.t==='E'||s.t==='C'){essN++;if(v==='oui')essOk++}});
 const secPct={},secFeel={};const vals=[];
 SECTIONS.forEach(s=>{const x=sec[s];secPct[s]=x.pos>0?Math.min(100,Math.round((x.got+x.bonus)/x.pos*100)):null;if(secPct[s]!=null)vals.push(secPct[s]);secFeel[s]=secR[s].length?Math.round(avg(secR[s])*20):null});
 let global=vals.length?Math.max(0,Math.round(avg(vals))-3*crit.length):null;
 const rate=f=>{const v=list.filter(f).map(s=>answers[s.id]).filter(x=>x==='oui'||x==='non');return v.length?Math.round(v.filter(x=>x==='oui').length/v.length*100):null};
 const pick=(t,k)=>{const s=list.find(x=>x.t===t&&x.k===k);return s?answers[s.id]:null};
 const st=pick('A','stars'),np=pick('S','nps'),pr=pick('S','scale'),ch=pick('S','choice');
 return {global,secPct,secFeel,crit,bonus,feel:rs.length?Math.round(avg(rs)*20):null,ess:{ok:essOk,n:essN},
  brand:rate(s=>s.t==='M'),upsell:rate(s=>s.t==='U'),digital:rate(s=>s.t==='D'),conc:rate(s=>s.t==='H'&&(s.st==='conciergerie'||s.st==='apres')),
  stars:st&&st.n||null,nps:np&&np.n!=null?np.n:null,price:pr&&pr.n||null,reason:ch&&ch.c||null};
}

 <div class="secbars">${SECTIONS.map(s=>{const v=mean(rs,r=>r.sc.secPct[s]);const f=mean(rs,r=>r.sc.secFeel&&r.sc.secFeel[s]);return `<div class="secbar"><span class="sb-l">${esc(s)}</span><div class="bar"><i class="${v!=null&&v>=OBJ?'ok':'ko'}" style="width:${v||0}%"></i><b class="obj" style="left:${OBJ}%"></b></div><span class="sb-v">${v==null?'n/a':v+' %'}</span><span class="sb-f">${f==null?'':'Ressenti '+f}</span></div>`}).join('')}</div>

const PUBLIC_URL=''; // adresse publique du site (GitHub Pages), utilisée pour tous les liens clients

${a.notes?'\nConsignes particulières : '+a.notes+'\n':''}

L'équipe Opérations Alfred Hotels

function shrink(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');const k=Math.min(1,1200/Math.max(img.width,img.height));cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(file)}

function ingestResponse(resp){
 if(REPORTS.some(r=>r.id==='r'+resp.auditId))return;
 const sc=computeScore(resp.format,resp.channel,resp.answers||{},resp.comments||{},resp.hotel);
 const r={id:'r'+resp.auditId,audit:resp.auditId,format:resp.format,hotel:resp.hotel,channel:resp.channel,from:resp.from||(resp.submittedAt||'').slice(0,10),to:resp.to,date:(resp.submittedAt||'').slice(0,10)||TODAY,auditor:resp.client||'Client mystère',email:resp.email||'',official:resp.official!==false,score:sc.global==null?0:sc.global,sc,status:'recu',review:null,answers:resp.answers||{},comments:resp.comments||{},photos:resp.photos||{},defects:resp.defects||[]};
 if(META[r.id])Object.assign(r,META[r.id]);if(REVIEWS[r.audit]){r.review=Object.assign({},r.review,REVIEWS[r.audit]);if(r.review.status==='confirmed'&&r.status==='relecture')r.status='valide'}
 REPORTS.push(r);
 const a=AUDITS.find(x=>x.id===resp.auditId);if(a)a.status='te';else AUDITS.push({id:resp.auditId,format:resp.format,hotel:resp.hotel,channel:resp.channel,from:resp.from,to:resp.to,who:'client',client:resp.client,email:resp.email,status:'te',official:resp.official!==false});
 if(sc.crit.length&&r.official&&!PLANS.some(p=>p.id==='pc'+resp.auditId))PLANS.push({id:'pc'+resp.auditId,crit:true,name:`🔴 Critiques · ${r.hotel} · ${fm(r.from)}`,hotel:r.hotel,by:'Automatique',status:'En cours',updated:fd(TODAY),due:addDays(r.date,15),report:r.id,actions:sc.crit.map(s=>({t:'Corriger : '+qText(s,r.hotel),done:false,proof:null}))});
 persist();
}

 rm(AUDITS,a=>CANCELLED.has(a.id));rm(REPORTS,r=>CANCELLED.has(r.audit));rm(PLANS,p=>CANCELLED.has(String(p.id).replace(/^pc/,'')))}

 const onReport=S.page==='report';purgeCancelled();persist();if(onReport)go('planning');else render();toast('Audit annulé');

/* ===== Exports d'un rapport : Excel (modèle « Client mystère ») et présentation PowerPoint (importable dans Canva) ===== */
/* Modules chargés à la demande : d'abord le dossier libs/ du site, sinon deux CDN publics */
const LIBS={excel:[['libs/exceljs.min.js','https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js','https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js'],'ExcelJS'],ppt:[['libs/pptxgen.bundle.js','https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js','https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js'],'PptxGenJS']};
const addScript=u=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>{s.remove();ko(new Error('lib'))};document.head.appendChild(s)});
async function loadLib(k){const [us,g]=LIBS[k];for(const u of us){if(window[g])return;try{await addScript(u)}catch(e){}}if(!window[g])throw new Error('lib')}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const SECLAB={Accueil:'Accueil',Produit:'Le produit','Petit-déjeuner':'Le petit-déjeuner',Service:'Le service','Conformité':'La conformité'};
const XTYPE={N:'Normal',E:'Essentiel',C:'Critique',B:'Essentiel',X:'Bonus',R:'Ressenti',M:'Marque',D:'Digital',U:'Upselling',H:'Hors note',S:'Sondage',A:'Avis'};
const fileBase=r=>`Client mystère - ${r.hotel} - ${FORMATS[r.format].l} - ${fm(r.from)}`.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\\/:*?"<>|·]/g,'').replace(/\s+/g,' ');
function ansTxt(s,v){if(v==null||v==='')return '';if(v==='oui')return 'Oui';if(v==='non')return 'Non';if(v==='na')return 'N/A';
 if(typeof v==='object'){if(v.crit)return Object.entries(v.crit).map(([k,n])=>k+' '+n+'/5').join(' · ');if(v.c)return v.c;if(v.txt!=null)return v.txt;if(v.n!=null)return s.k==='nps'?v.n+'/10':v.n+'/5'}return String(v)}
function ptsOf(s,v,com){if(s.t==='X')return v==='oui'&&String(com||'').trim()?1:0;if(!PTS[s.t]||v!=='non')return PTS[s.t]?0:'';return -Math.round(PTS[s.t]*100)/100}
/* Rapports comparables : même hôtel, même année, jusqu'au mois de ce rapport */
function histOf(r){const y=(r.from||'').slice(0,4);return REPORTS.filter(x=>x.hotel===r.hotel&&(x.official||x.id===r.id)&&(x.from||'').slice(0,4)===y&&(x.from||'')<=(r.from||'')).sort((a,b)=>(a.from||'').localeCompare(b.from||''))}
const typeRates=x=>{const L=stdsFor(x.format,x.channel,x.hotel);const rt=f=>{const v=L.filter(f).map(s=>x.answers[s.id]).filter(a=>a==='oui'||a==='non');return v.length?Math.round(v.filter(a=>a==='oui').length/v.length*100):null};const bx=L.filter(s=>s.t==='X');
 return {N:rt(s=>s.t==='N'),E:rt(s=>s.t==='E'||s.t==='C'||s.t==='B'),X:bx.length?Math.round(bx.filter(s=>x.answers[s.id]==='oui'&&String(x.comments[s.id]||'').trim()).length/bx.length*100):null}};

async function exportExcel(id){const r=REPORTS.find(x=>x.id===id);if(!r)return;toast('Préparation du fichier Excel…');
 try{await loadLib('excel')}catch(e){toast("Le module Excel n'a pas pu être chargé (connexion)");return}
 const list=stdsFor(r.format,r.channel,r.hotel),A=r.answers,C=r.comments;
 const wb=new ExcelJS.Workbook();wb.calcProperties.fullCalcOnLoad=true;
 const ws=wb.addWorksheet(FORMATS[r.format].l.toUpperCase(),{views:[{state:'frozen',ySplit:4}]});
 ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9};
 ws.columns=[{width:18},{width:26},{width:62},{width:13},{width:11},{width:9},{width:42},{width:7,hidden:true},{width:26},{width:30}];
 const fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+c}});const thin={style:'thin',color:{argb:'FFBDBDBD'}};const box={top:thin,left:thin,bottom:thin,right:thin};
 const put=(r_,c,v,st={})=>{const cell=ws.getCell(r_,c);cell.value=v;cell.font={name:'Arial',size:9,...(st.font||{})};if(st.fill)cell.fill=fill(st.fill);cell.alignment={vertical:'middle',wrapText:true,horizontal:st.al||'left'};if(st.border!==false)cell.border=box;if(st.fmt)cell.numFmt=st.fmt;return cell};
 const f=(formula)=>({formula});
 ws.mergeCells(1,1,1,6);put(1,1,`CLIENT MYSTÈRE — ${r.hotel.toUpperCase()}`,{fill:'2A371F',al:'center',border:false,font:{size:16,bold:true,color:{argb:'FFFFFFFF'}}});ws.getRow(1).height=30;
 ws.mergeCells(2,1,2,6);put(2,1,`Outil de suivi — Audit Client Mystère Alfred Hotels · ${fm(r.from)} · ${r.auditor}`,{fill:'F5F5F0',al:'center',border:false,font:{size:10,color:{argb:'FF555555'}}});
 ws.mergeCells(3,1,3,6);put(3,1,`SCÉNARIO : ${FORMATS[r.format].l.toUpperCase()}`,{fill:'974528',al:'center',border:false,font:{size:13,bold:true,color:{argb:'FFFFFFFF'}}});ws.getRow(3).height=24;
 ['Catégorie','Sous-catégorie','Point de contrôle','Type','Note','Points','Commentaire du client','Poids'].forEach((h,i)=>put(4,i+1,h,{fill:'974528',al:'center',font:{bold:true,size:10,color:{argb:'FFFFFFFF'}}}));
 let row=5;const noteCells=[],rCells=[];
 const typeOf=s=>s.t==='H'?(s.free?'Hors note':'Conciergerie'):(XTYPE[s.t]||s.t);
 const qRow=(cat,sub,s)=>{const v=A[s.id];const t=typeOf(s);const w=PTS[s.t]||0;const R_=row;
  put(row,1,cat,{fill:'D5E8D4',al:'center',font:{bold:true}});put(row,2,sub,{fill:'ECEFF1',al:'center'});put(row,3,qText(s,r.hotel));
  put(row,4,t,{fill:{Essentiel:'FFE0B2',Critique:'F8BBB6',Bonus:'DCEDC8',Normal:'FFF9C4',Ressenti:'E8EAF6'}[t]||'E3F2FD',al:'center',font:{bold:t==='Essentiel'||t==='Critique'}});
  if(s.t==='R'){put(row,5,v&&v.n?+v.n:'',{fill:'FFFDE7',al:'center',fmt:'0" / 5"'});rCells.push('E'+R_)}
  else{const nt=ansTxt(s,v);put(row,5,nt,{fill:'FFFDE7',al:'center'});if(!RICH(s))noteCells.push('E'+R_)}
  /* Points : formules, recalculées si une réponse change */
  const pf=s.t==='X'?`IF(AND(E${R_}="Oui",G${R_}<>""),1,0)`:w?`IF(E${R_}="Non",-H${R_},IF(E${R_}="Oui",0,""))`:null;
  put(row,6,pf?f(pf):'',{fill:'F5F5F5',al:'center',fmt:'0.##'});
  put(row,7,String(C[s.id]||'').trim());put(row,8,w||'',{al:'center',fmt:'0.00'});row++};
 const block=(cat,qs)=>{if(!qs.length)return;const start=row;const subs=[...new Set(qs.map(s=>s.sub))];
  subs.forEach(sb=>{const st=row;qs.filter(s=>s.sub===sb).forEach(s=>qRow(cat,sb,s));if(row-1>st)ws.mergeCells(st,2,row-1,2)});
  if(row-1>start)ws.mergeCells(start,1,row-1,1)};
 const secPctCells=[];
 SECTIONS.forEach(sec=>{const qs=list.filter(s=>s.sec===sec);if(!qs.length)return;const lab=SECLAB[sec];
  const head=row;ws.mergeCells(row,1,row,4);put(row,1,`► ${lab} — ressenti du client (moyenne)`,{fill:'F5F5F0',font:{color:{argb:'FF555555'}}});row++;
  const a=row;const r0=rCells.length;block(lab,qs.filter(s=>s.t!=='R'));block(lab,qs.filter(s=>s.t==='R'));const b=row-1;
  const rs=rCells.slice(r0);put(head,5,rs.length?f(`IFERROR(AVERAGE(${rs.join(',')}),"")`):'',{fill:'FFFDE7',al:'center',fmt:'0.0" / 5"'});ws.mergeCells(head,5,head,6);

function trimestriel(){

 if(!l3.length)return `<div class="greybox"><span style="font-size:28px">🗓️</span>Aucun audit officiel pour ${esc(S.estab)}. Le bilan trimestriel s'appuie sur les trois derniers audits.</div>`;
 const fails={};l3.forEach(r=>stdsFor(r.format,r.channel,r.hotel).forEach(s=>{if(['N','E','C'].includes(s.t)&&r.answers[s.id]==='non'){fails[s.id]=fails[s.id]||{s,n:0};fails[s.id].n++}}));
 const rec=Object.values(fails).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n);const pon=Object.values(fails).filter(x=>x.n===1);
 const first=l3[0],last=l3[l3.length-1];const d=last.score-first.score;
 const rows=[['Note globale',r=>scorePill(r.score)],...SECTIONS.map(s=>[s,r=>scorePill(r.sc.secPct[s])]),['Critiques ratées',r=>r.sc.crit.length?`<span class="pill red">${r.sc.crit.length}</span>`:'0'],['Indice ressenti',r=>idx(r.sc.feel)],['Marque',r=>r.sc.brand==null?'n/a':r.sc.brand+' %'],['Upselling',r=>r.sc.upsell==null?'n/a':r.sc.upsell+' %'],['Avis',r=>r.sc.stars?starsTxt(r.sc.stars):'n/a']];

 render=()=>{document.getElementById('app').innerHTML=questionnaire(true)};render();
 const apply=(aud,resp,draft,rev)=>{if(aud)Object.assign(a,aud);if(a.cancelled){Q.cancelled=true;return}if(resp){if(!Q.done)Q.already=resp;Q.done=true;Q.sent=true;Q.resp=resp;if(rev)Q.review=rev}else if(draft&&!Object.keys(Q.answers).length){Q.answers=draft.answers||{};Q.comments=draft.comments||{};Q.defects=draft.defects||[];Q.stageDone=draft.stageDone||{};Q.photos=draft.photos||{}}};

  DBS.db=await useCap('db');DBS.user=await useCap('user');DBS.assets=await useCap('assets');if(DBS.user){try{DBS.canWrite=await DBS.user.can('data.write')}catch(e){}}
  if(DBS.db){try{const g=async c=>{const x=await DBS.db.doc(c+'/'+p.id).get();return x.exists?x.data():null};const resp=await g('responses');apply(await g('audits'),resp,resp?null:await g('drafts'),resp?await g('reviews'):null)}catch(e){}}
  render()})();
 return true;
}
const mergeInto=(arr,m)=>{const i=arr.findIndex(x=>x.id===m.id);if(i<0)arr.push(m);else Object.assign(arr[i],m)};
function applyMeta(id,v){META[id]=v;const r=REPORTS.find(x=>x.id===id);if(r)Object.assign(r,v)}
function applyReview(id,v){REVIEWS[id]=v;const r=REPORTS.find(x=>x.audit===id);if(r){r.review=Object.assign({},r.review,v);if(v.status==='confirmed'&&r.status==='relecture'){r.status='valide';saveMeta(r)}}}
/* Les questionnaires validés arrivent seuls : chargement à l'ouverture puis toutes les 60 secondes. */
async function loadFromApi(){try{const j=await API.get({all:1});const it=j.items||[];
 it.filter(x=>x.c==='audits').forEach(x=>mergeInto(AUDITS,x.d));it.filter(x=>x.c==='responses').forEach(x=>ingestResponse(x.d));it.filter(x=>x.c==='plans').forEach(x=>mergeInto(PLANS,x.d));
 it.filter(x=>x.c==='reportmeta').forEach(x=>applyMeta(x.id,x.d));it.filter(x=>x.c==='reviews').forEach(x=>applyReview(x.id,x.d));
 DBS.live=true;persist();render()}catch(e){DBS.live=false;render()}}
async function bootPlatform(){
 if(API.on){await loadFromApi();setInterval(()=>{if(!document.hidden)loadFromApi()},60000);return}
 DBS.db=await useCap('db');DBS.assets=await useCap('assets');if(!DBS.db)return;DBS.live=true;
 try{DBS.db.collection('audits').onSnapshot(snap=>{snap.docs.forEach(d=>mergeInto(AUDITS,d.data()));render()},()=>{});
  DBS.db.collection('responses').onSnapshot(snap=>{snap.docs.forEach(d=>ingestResponse(d.data()));render()},()=>{});
  DBS.db.collection('plans').onSnapshot(snap=>{snap.docs.forEach(d=>mergeInto(PLANS,d.data()));render()},()=>{});
  DBS.db.collection('reportmeta').onSnapshot(snap=>{snap.docs.forEach(d=>applyMeta(d.id,d.data()));render()},()=>{});
  DBS.db.collection('cardex').onSnapshot(snap=>{CARDEX=snap.docs.map(d=>d.data()).filter(x=>!x.deleted);CX.state='ok';render()},()=>{});
  DBS.db.collection('reviews').onSnapshot(snap=>{snap.docs.forEach(d=>applyReview(d.id,d.data()));render()},()=>{});}catch(e){}
}
if(!clientMode()){restoreLocal();loadDemo();render();bootPlatform()}

</script>
