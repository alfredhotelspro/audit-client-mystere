.bgveil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,253,240,.55),rgba(255,253,240,.25) 30%,rgba(255,253,240,.25) 70%,rgba(255,253,240,.55))}
h1,h2{font-family:var(--fh);font-weight:600;margin:0;text-wrap:balance;color:var(--title)}
h1{font-size:28px;line-height:1.2}
header.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:60px;z-index:50;background:rgba(255,253,240,.96);border-bottom:.67px solid var(--line);display:flex;align-items:center;gap:8px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;font-family:var(--fh);font-weight:600;font-size:16px;color:var(--navy);padding:0;white-space:nowrap}
.brand .p{width:32px;height:32px;border-radius:9px;background:var(--wine);color:#fffdf0;display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:17px;flex:none}
nav.main{display:flex;gap:4px;margin-left:16px}
nav.main a{padding:8px 12px;border-radius:9999px;color:var(--navy);font:500 14px var(--fb);cursor:pointer;text-decoration:none}
nav.main a:hover{background:var(--field)} nav.main a.on{background:var(--sage-bg)}
.spacer{flex:1}
.seal{width:34px;height:34px;border-radius:50%;background:var(--terra);color:#fffdf0;display:grid;place-items:center;font-family:"Georgia",serif;font-style:italic;font-size:17px;flex:none}
.estab{height:36px;border-radius:9999px;background:var(--sage-bg);border:0;color:var(--navy);font:500 14px var(--fb);padding:0 14px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.avbtn{display:flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--navy);padding:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:13px;background:var(--terra-bg);color:var(--terra);flex:none}
.av.me{background:var(--navy);color:#fffdf0}
.hamb{display:none;background:none;border:0;color:var(--navy);font-size:22px;cursor:pointer;padding:6px 4px;flex:none;margin-right:-4px}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-block:88px 28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border-radius:25px;padding:24px;border:.67px solid var(--line)}
.card+.card{margin-top:16px}
.sub{color:var(--grey);font-size:15px;margin:4px 0 0}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;padding-bottom:16px;border-bottom:.67px solid var(--line);margin-bottom:20px}
.crumb{font-size:12px;color:var(--grey);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:9999px;border:0;background:var(--navy);color:#fffdf0;font:500 15px/1.2 var(--fb);cursor:pointer;text-decoration:none;text-align:center;max-width:100%}
.btn.sec{background:var(--field);color:var(--navy)}
.btn.sm{min-height:32px;padding:5px 14px}
.btn.outl{background:#fff;border:.67px solid var(--line);color:var(--navy)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.lbl{font:500 14px var(--fb);color:var(--navy);display:block;margin-bottom:6px}
.field{display:flex;flex-direction:column;min-width:0}
select,input[type=search],input[type=text],input[type=password],input[type=date],input[type=month],textarea{height:36px;border-radius:9999px;border:0;background:var(--field);color:var(--ink);font:400 16px var(--fb);padding:0 14px;width:100%;min-width:0}
textarea{height:auto;min-height:80px;border-radius:16px;padding:10px 14px;resize:vertical}
select{appearance:none;padding-right:34px}
.sel{position:relative}.sel::after{content:"⌄";position:absolute;right:14px;top:50%;transform:translateY(-60%);pointer-events:none;color:var(--navy)}
.search{position:relative}.search input{padding-left:36px}.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.band{background:var(--field);border-radius:9999px;padding:8px 16px;font-size:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:16px 0}
.band b{font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.d-or{background:var(--orange)}.d-bl{background:var(--navy)}.d-gr{background:var(--sage)}.d-gy{background:#b9bdb3}.d-rd{background:var(--terra)}
.switch{display:inline-flex;background:var(--field);border-radius:9999px;padding:3px;gap:2px;height:36px}
.switch button{border:0;background:transparent;border-radius:9999px;padding:0 14px;color:var(--navy);font:500 14px var(--fb);cursor:pointer;display:flex;align-items:center;gap:6px}
.switch button.on{background:#fff}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--field);color:var(--navy);cursor:pointer;font-size:15px;display:grid;place-items:center;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--grey);font-size:14px}
.ico-round{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
em.e{font-style:italic;color:var(--navy)}
.kpi{position:relative;background:#fff;border:.67px solid var(--line);border-radius:25px;padding:24px}
.kpi .t{font:500 15px var(--fb);color:var(--navy)}.kpi .ic{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;background:var(--sage-bg);display:grid;place-items:center;font-size:16px}
.kpi .v{font:700 28px var(--fh);margin-top:12px;color:var(--navy)}.kpi .c{font-size:12px;color:var(--grey);margin-top:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.mtag{border-radius:10px;padding:6px 14px;font-weight:500;color:#fff;background:#e6cfc3}.mtag.cur{background:var(--terra)}
.mval{color:var(--terra);font-weight:500}.mval.p{color:#c9a08e}
.greybox{background:var(--sage-bg);border-radius:20px;min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--navy);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:3px 10px;font-size:12px;background:var(--field);color:var(--navy);white-space:nowrap}
.pill.green{background:var(--sage-bg);color:var(--green)}.pill.red{background:var(--terra-bg);color:var(--terra)}.pill.orange{background:#f6e9d9;color:var(--orange)}.pill.blue{background:var(--sage-bg);color:var(--navy)}
.fmt{display:flex;gap:16px;background:#fff;border:.67px solid var(--line);border-radius:25px;padding:16px;align-items:center;flex-wrap:wrap}
.fmt .ph{width:120px;height:120px;border-radius:20px;flex:none;display:grid;place-items:center;font-size:40px}
.fmt .ph.business{background:linear-gradient(135deg,var(--sage),var(--navy))}.fmt .ph.famille{background:linear-gradient(135deg,#e6cfc3,var(--terra))}.fmt .ph.couple{background:linear-gradient(135deg,#c9b9a0,var(--wine))}
.fmt .body{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.fmt .ttl{font:600 18px var(--fh);color:var(--navy)}.fmt .m1{font-size:13px;color:var(--grey)}
.fmt .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sec-head{display:flex;justify-content:space-between;align-items:center;border:.67px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:8px 14px;margin:20px 0 12px;font:500 15px var(--fb);color:var(--navy)}
.q{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;background:#fff;border:.67px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.q .num{width:32px;height:32px;border-radius:50%;background:var(--sage-bg);display:grid;place-items:center;font-size:13px;color:var(--navy);font-weight:500}

/* Réponse complète ? Une critique ratée exige une photo (point de vigilance de la présentation). */
function ansOk(s,v,photo){if(v==null||v==='')return false;
 if(RICH(s)){if(s.k==='choice')return !!v.c;if(s.k==='sub')return SUBCRIT.every(c=>v.crit&&v.crit[c]);if(['title','pos','neg','text'].includes(s.k))return !!(v.txt&&v.txt.trim());return v.n!=null}
 if(s.t==='C'&&v==='non')return !!photo;return true}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* Barème : section = points obtenus / possibles (Sans objet exclu), un bonus factuel par section, plafonné à 100 %.
   Note globale = moyenne des 5 sections − 3 par critique ratée. Ressenti, marque, upselling, digital, avis : indicateurs à part. */
function computeScore(format,channel,answers,comments){answers=answers||{};comments=comments||{};
 const list=stdsFor(format,channel);const sec={},secR={};const crit=[],bonus=[],rs=[];let essOk=0,essN=0;
 SECTIONS.forEach(s=>{sec[s]={got:0,pos:0,bonus:0};secR[s]=[]});
 list.forEach(s=>{const v=answers[s.id];
  if(s.t==='R'){if(v&&v.n){rs.push(+v.n);if(secR[s.sec])secR[s.sec].push(+v.n)}return}
  if(s.t==='X'){if(v==='oui'&&String(comments[s.id]||'').trim()){sec[s.sec].bonus=1;bonus.push(s)}return}
  if(!PTS[s.t]||!v||v==='na')return;
  const p=PTS[s.t];sec[s.sec].pos+=p;if(v==='oui')sec[s.sec].got+=p;else if(s.t==='C')crit.push(s);
  if(s.t==='E'||s.t==='C'){essN++;if(v==='oui')essOk++}});
 const secPct={},secFeel={};const vals=[];
 SECTIONS.forEach(s=>{const x=sec[s];secPct[s]=x.pos>0?Math.min(100,Math.round((x.got+x.bonus)/x.pos*100)):null;if(secPct[s]!=null)vals.push(secPct[s]);secFeel[s]=secR[s].length?Math.round(avg(secR[s])*20):null});
 let global=vals.length?Math.max(0,Math.round(avg(vals))-3*crit.length):null;
 const rate=f=>{const v=list.filter(f).map(s=>answers[s.id]).filter(x=>x==='oui'||x==='non');return v.length?Math.round(v.filter(x=>x==='oui').length/v.length*100):null};
 const pick=(t,k)=>{const s=list.find(x=>x.t===t&&x.k===k);return s?answers[s.id]:null};
 const st=pick('A','stars'),np=pick('S','nps'),pr=pick('S','scale'),ch=pick('S','choice');
 return {global,secPct,secFeel,crit,bonus,feel:rs.length?Math.round(avg(rs)*20):null,ess:{ok:essOk,n:essN},
  brand:rate(s=>s.t==='M'),upsell:rate(s=>s.t==='U'),digital:rate(s=>s.t==='D'),conc:rate(s=>s.t==='H'&&(s.st==='conciergerie'||s.st==='apres')),
  stars:st&&st.n||null,nps:np&&np.n!=null?np.n:null,price:pr&&pr.n||null,reason:ch&&ch.c||null};
}

 else if(NA.step===2)body=`<span class="lbl">Dans quel hôtel ?</span><div class="chips">${HOTELS.map(h=>`<button class="chip ${NA.hotel===h?'on':''}" onclick="NA.hotel='${esc(h)}';renderNA()">${esc(h)}</button>`).join('')}</div>`;
 else if(NA.step===3)body=`<span class="lbl">Comment le séjour est-il réservé ?</span><div class="chips">${Object.entries(CHANNELS).map(([k,c])=>`<button class="chip big ${NA.channel===k?'on':''}" onclick="NA.channel='${k}';renderNA()"><span>${c.l}</span><small>${esc(c.hint)}</small></button>`).join('')}</div><p class="sub" style="margin-top:12px">Quel que soit ce choix, le client appelle aussi l'hôtel : l'appel est le seul échange direct évalué avant le séjour. Le parcours digital est évalué à part.</p>`;
 else body=`<span class="lbl">Dates du séjour</span><div class="grid g2"><input type="date" id="na-f" aria-label="Arrivée" value="${NA.from}" onchange="NA.from=this.value"><input type="date" id="na-t" aria-label="Départ" value="${NA.to}" onchange="NA.to=this.value"></div>
  <span class="lbl" style="margin-top:14px">Qui réalise l'audit ?</span><div class="chips"><button class="chip big ${NA.who==='client'?'on':''}" onclick="NA.who='client';renderNA()"><span>🔗 Un client mystère externe</span><small>Vous obtenez son lien et l'e-mail de bienvenue.</small></button><button class="chip big ${NA.who==='me'?'on':''}" onclick="NA.who='me';renderNA()"><span>📝 Moi, maintenant</span><small>Le questionnaire s'ouvre tout de suite.</small></button></div>
  ${NA.who==='client'?`<div class="grid g2" style="margin-top:14px"><div class="field"><label class="lbl" for="na-c">Nom du client mystère</label><input type="text" id="na-c" value="${esc(NA.client)}" placeholder="Ex. Claire Morel" oninput="NA.client=this.value"></div><div class="field"><label class="lbl" for="na-e">Son e-mail</label><input type="text" id="na-e" value="${esc(NA.email)}" placeholder="prenom@exemple.fr" oninput="NA.email=this.value"></div></div><div class="field" style="margin-top:12px"><label class="lbl" for="na-n">Consignes pour le client (optionnel)</label><textarea id="na-n" placeholder="Ex. Demander un lit bébé, tester le petit-déjeuner avant 8 h." oninput="NA.notes=this.value">${esc(NA.notes)}</textarea></div>`:''}
  <label class="check" style="margin-top:14px"><input type="checkbox" ${NA.test?'checked':''} onchange="NA.test=this.checked"><span><b style="font-weight:500">Audit test ou d'entraînement</b><br><small>Non comptabilisé dans les performances. Utile pour tester l'outil.</small></span></label>`;
 openModal(`<div class="eyebrow">Nouvel audit</div><h2 style="margin-top:4px">${FORMATS[NA.format].ico} Client Mystère - ${FORMATS[NA.format].l}${NA.step>2?' · '+esc(NA.hotel):''}${NA.step>3?' · '+CHANNELS[NA.channel].l:''}</h2>${stepsBar}${body}
 <div class="mfoot"><button class="btn sec" onclick="${NA.step>1?'NA.step--;renderNA()':'closeAll()'}">${NA.step>1?'‹ Précédent':'Annuler'}</button>${NA.step<4?`<button class="btn" onclick="NA.step++;renderNA()">Suivant ›</button>`:`<button class="btn" onclick="createAudit()">${NA.who==='client'?'Créer et obtenir le lien':'Commencer le questionnaire'}</button>`}</div>`);
}
const newId=()=>Math.random().toString(36).slice(2,8);

/* ===== Questionnaire : parcours en moments (client mystère et audit interne) ===== */
const Q={a:null,answers:{},comments:{},photos:{},defects:[],stageDone:{},view:'home',stage:null,done:false,code:'',client:false,saved:'',review:null};
function qKey(){return 'q-'+Q.a.id}
function saveQ(silent){Q.saved=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});try{localStorage.setItem(qKey(),JSON.stringify({answers:Q.answers,comments:Q.comments,photos:Q.photos,defects:Q.defects,stageDone:Q.stageDone,done:Q.done,code:Q.code}))}catch(e){}
 if(DBS.db&&DBS.canWrite!==false&&!Q.done){clearTimeout(Q._t);Q._t=setTimeout(async()=>{try{await DBS.db.doc('drafts/'+Q.a.id).set({answers:Q.answers,comments:Q.comments,stageDone:Q.stageDone,defects:Q.defects.map(d=>({caption:d.caption,id:d.id,url:d.url})),updated:new Date().toISOString()});const d=AUDITS.find(x=>x.id===Q.a.id);if(d&&d.status==='nd'){d.status='ec';try{await DBS.db.doc('audits/'+Q.a.id).update({status:'ec'})}catch(e){}}}catch(e){}},1200)}
 if(!silent)toast('Enregistré · vous pouvez reprendre plus tard')}
function loadQ(a,client){Q.a=a;Q.client=!!client;Q.answers={};Q.comments={};Q.photos={};Q.defects=[];Q.stageDone={};Q.view='home';Q.stage=null;Q.done=false;Q.code='';Q.review=null;try{const s=localStorage.getItem(qKey());if(s)Object.assign(Q,JSON.parse(s))}catch(e){}}
function startInternal(id){const a=AUDITS.find(x=>x.id===id);loadQ(a,false);if(a.status==='nd')a.status='ec';persist();go('audit',{id})}
function qList(){return stdsFor(Q.a.format,Q.a.channel)}
const isAnswered=s=>ansOk(s,Q.answers[s.id],Q.photos[s.id]);
const counted=s=>!s.opt;
function audit(){if(!Q.a||Q.a.id!==S.params.id){const a=AUDITS.find(x=>x.id===S.params.id);if(!a)return checklists();loadQ(a,false)}return questionnaire(false)}

function setA(id,v){Q.answers[id]=v;saveQ(true);render()}

function questionnaire(client){
 const a=Q.a;const list=qList().filter(counted);const answered=list.filter(isAnswered).length;const total=list.length;
 if(Q.done&&Q.review&&Q.review.status==='pending')return reviewView();

 if(Q.view==='stage'&&Q.stage)return stageView(client);
 const stDone=k=>{const g=list.filter(s=>s.st===k);const d=g.filter(isAnswered).length;return {g:g.length,d,pct:g.length?Math.round(d/g.length*100):100,ok:Q.stageDone[k]||(g.length&&d===g.length)}};
 const shown=STAGES.filter(st=>qList().some(s=>s.st===st.k));const allDone=shown.every(st=>stDone(st.k).ok);
 const missingPh=qList().filter(s=>s.t==='C'&&Q.answers[s.id]==='non'&&!Q.photos[s.id]).length;
 return `<section class="card"><div class="head" style="border:0;padding-bottom:0;margin-bottom:0"><div><div class="eyebrow">Alfred Hotels · ${esc(a.hotel)} · ${FORMATS[a.format].l} · ${CHANNELS[a.channel].l}${client?'':' · '+esc(a.client)}</div><h1 style="font-size:26px;margin-top:4px">${client?(answered?'Bon retour':'Bienvenue dans l\'expérience client mystère')+(a.client&&a.client!=='Client mystère'?', '+esc(a.client.split(' ')[0]):''):esc('Client Mystère - '+FORMATS[a.format].l)}</h1><p class="sub">${client?`Votre séjour${a.from?' du '+fd(a.from)+' au '+fd(a.to):''} se vit en ${shown.length} moments. À chaque moment, ouvrez la case correspondante et répondez à quelques questions. Vous choisissez l'ordre, tout est enregistré au fur et à mesure.`:`Séjour ${fm(a.from)}${a.official?'':' · audit test'}. Remplissez chaque moment quand vous le vivez.`}</p></div>${client?'':`<button class="btn sec sm" onclick="saveQ();go('planning')">⏸ Pause</button>`}</div>
 <div class="progrow"><span><b style="font-weight:500;color:var(--navy)">Mon avancement</b><br>${answered} / ${total} réponses</span><div class="progress"><i style="width:${total?Math.round(answered/total*100):0}%"></i></div><span>${total?Math.round(answered/total*100):0} %</span><span class="pill">${Q.saved?'Enregistré à '+Q.saved:'Enregistrement automatique'}</span></div>
 ${a.notes&&client?`<div class="notice" style="margin:8px 0 4px"><b style="font-weight:500">Consignes pour votre séjour</b><br>${esc(a.notes)}</div>`:''}

function advance(id){const r=REPORTS.find(x=>x.id===id);if(!r)return;

/* ===== Plans d'action ===== */
const prog=p=>p.actions.length?Math.round(p.actions.filter(a=>a.done).length/p.actions.length*100):0;
function plans(){
 const ps=PLANS.filter(p=>p.hotel===S.estab).sort((a,b)=>(b.crit?1:0)-(a.crit?1:0));
 return `<section class="card"><div class="head"><div>${crumb('')}<h1>Plans d'action</h1><p class="sub">Les critiques ratées ouvrent automatiquement un plan à traiter sous 15 jours, avec photo de la correction.</p></div><button class="btn" onclick="newPlan()">+ Créer un plan d'action</button></div>
 <div class="band"><b>${ps.length} plan${ps.length>1?'s':''}</b><span><span class="dot d-rd"></span>${ps.filter(p=>p.crit&&p.status!=='Terminé').length} critique(s) ouverte(s)</span><span><span class="dot d-or"></span>${ps.filter(p=>p.status==='En cours').length} en cours</span><span><span class="dot d-gr"></span>${ps.filter(p=>p.status==='Terminé').length} terminé(s)</span></div>
 <div class="tblbox"><table><thead><tr><th>Plan d'action</th><th>Avancement</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>${ps.length?ps.map(p=>{const late=p.due&&p.status!=='Terminé'&&p.due<TODAY;return `<tr class="row" onclick="go('plan',{id:'${p.id}'})"><td>${esc(p.name)}<div class="small">${esc(p.by)}</div></td><td><div class="prog"><div class="bar"><i style="width:${prog(p)}%"></i></div>${prog(p)} %</div></td><td>${p.due?`<span class="pill ${late?'red':'orange'}">${late?'En retard · ':''}${fd(p.due)}</span>`:'—'}</td><td><span class="pill ${p.status==='Terminé'?'green':'orange'}">${p.status}</span></td></tr>`}).join(''):`<tr><td colspan="4" style="padding:0;border:0;background:transparent"><div style="min-height:200px;display:grid;place-items:center">${empty('🎯',"Aucun plan d'action pour le moment.")}</div></td></tr>`}</tbody></table></div></section>`;
}
function newPlan(rid,items,name){
 const r=rid?REPORTS.find(x=>x.id===rid):null;const nc=items||(r?stdsFor(r.format,r.channel).filter(s=>r.answers[s.id]==='non'&&['N','E','C'].includes(s.t)):[]);
 openModal(`<h2>Créer un plan d'action</h2><p class="sub">Regroupez les actions correctives à mener.</p><div class="field" style="margin-top:16px"><label class="lbl" for="pl-n">Nom du plan</label><input type="text" id="pl-n" value="${esc(name||(r?r.hotel+' · '+FORMATS[r.format].l+' · '+fm(r.from):''))}" placeholder="Ex. Petit-déjeuner : buffet salé"></div>
 ${r||items?'':`<div class="field" style="margin-top:12px"><label class="lbl" for="pl-r">Rapport associé</label><div class="sel"><select id="pl-r"><option value="">Aucun rapport</option>${REPORTS.map(x=>`<option value="${x.id}">${esc(auditLabel(x))}</option>`).join('')}</select></div></div>`}
 ${nc.length?`<span class="lbl" style="margin-top:12px">Points à corriger</span>${nc.map(s=>`<label class="check" style="margin-bottom:6px"><input type="checkbox" class="pl-s" checked value="${s.id}"><span>${esc(qText(s,r?r.hotel:S.estab))}</span></label>`).join('')}`:''}
 <div class="grid g2" style="margin-top:12px"><div class="field"><label class="lbl" for="pl-a">Autre action (optionnel)</label><input type="text" id="pl-a" placeholder="Ex. Brief équipe petit-déjeuner"></div><div class="field"><label class="lbl" for="pl-d">Échéance</label><input type="date" id="pl-d" value="${addDays(TODAY,30)}"></div></div><div class="mfoot" style="justify-content:flex-end"><button class="btn sec" onclick="closeAll()">Annuler</button><button class="btn" onclick="doPlan('${rid||''}')">Créer le plan</button></div>`);
}
function doPlan(rid){const n=document.getElementById('pl-n').value.trim();if(!n){toast('Indiquez un nom');return}let r=rid?REPORTS.find(x=>x.id===rid):null;if(!r){const s=document.getElementById('pl-r');if(s&&s.value)r=REPORTS.find(x=>x.id===s.value)}const h=r?r.hotel:S.estab;const acts=[...document.querySelectorAll('.pl-s:checked')].map(x=>({t:'Corriger : '+qText(STANDARDS[+x.value],h),done:false,proof:null}));const a1=document.getElementById('pl-a').value.trim();if(a1)acts.push({t:a1,done:false,proof:null});if(!acts.length)acts.push({t:'Définir la première action',done:false,proof:null});const p={id:'p'+Date.now(),name:n,hotel:h,by:USER.name,status:'En cours',updated:fd(TODAY),due:document.getElementById('pl-d').value,actions:acts,report:r?r.id:null};PLANS.push(p);savePlan(p);closeAll();toast("Plan d'action créé");go('plan',{id:p.id})}
function plan(){
 const p=PLANS.find(x=>x.id===S.params.id);if(!p)return plans();const late=p.due&&p.status!=='Terminé'&&p.due<TODAY;
 return `<div style="margin-bottom:16px"><a class="btn sec sm" onclick="go('action-plans')">‹ Retour</a></div><section class="card"><div class="head"><div>${crumb("Plans d'action")}<h1 style="font-size:24px">${esc(p.name)}</h1><p class="sub">${esc(p.hotel)} · ${esc(p.by)} · mis à jour le ${p.updated} · <span class="pill ${p.status==='Terminé'?'green':'orange'}">${p.status}</span>${p.due?` · <span class="pill ${late?'red':'orange'}">échéance ${fd(p.due)}</span>`:''}${p.report?` · <a style="cursor:pointer;text-decoration:underline" onclick="go('report',{id:'${p.report}'})">voir le rapport</a>`:''}</p></div><button class="btn" onclick="askAct('${p.id}')">+ Ajouter une action</button></div>
 ${p.crit?`<div class="notice warn" style="margin-bottom:12px">Plan ouvert automatiquement par une critique ratée. Chaque action se clôt avec <b style="font-weight:500">la photo de la correction</b>.</div>`:''}
 <div class="prog" style="margin-bottom:16px"><div class="bar" style="height:10px"><i style="width:${prog(p)}%"></i></div><b style="font-weight:500">${prog(p)} %</b></div>
 ${p.actions.map((a,i)=>`<div class="acard"><label class="check" style="flex:1;margin:0"><input type="checkbox" ${a.done?'checked':''} onchange="toggleAct('${p.id}',${i},this.checked)"><span style="${a.done?'text-decoration:line-through;color:var(--grey)':''}">${esc(a.t)}</span></label><div style="display:flex;gap:8px;align-items:center">${a.proof?`<img src="${a.proof.url||a.proof.data}" alt="Correction" class="thumb" onclick="zoomRef(this.src,'Photo de la correction')">`:''}<label class="btn sec sm" style="cursor:pointer">📷 ${a.proof?'Changer':'Photo de la correction'}<input type="file" accept="image/*" hidden onchange="addProof('${p.id}',${i},this)"></label></div></div>`).join('')}</section>`;
}
function addProof(pid,i,inp){const f=inp.files[0];if(!f)return;shrink(f,async d=>{const p=PLANS.find(x=>x.id===pid);p.actions[i].proof=await upOne({data:d});p.updated=fd(TODAY);savePlan(p);render();toast('Photo ajoutée')})}
function toggleAct(pid,i,v){const p=PLANS.find(x=>x.id===pid);if(v&&p.crit&&!p.actions[i].proof){toast('Ajoutez d\'abord la photo de la correction');render();return}p.actions[i].done=v;p.status=p.actions.every(a=>a.done)?'Terminé':'En cours';p.updated=fd(TODAY);savePlan(p);render()}
function askAct(pid){openModal(`<h2>Nouvelle action</h2><div class="field" style="margin-top:16px"><label class="lbl" for="pa-t">Action</label><input type="text" id="pa-t"></div><div class="mfoot" style="justify-content:flex-end"><button class="btn sec" onclick="closeAll()">Annuler</button><button class="btn" onclick="addAct('${pid}')">Ajouter</button></div>`)}
function addAct(pid){const t=document.getElementById('pa-t').value.trim();if(!t)return;const p=PLANS.find(x=>x.id===pid);p.actions.push({t,done:false,proof:null});p.status='En cours';savePlan(p);closeAll();render()}

/* ===== Performances : récapitulatif, bilan trimestriel, voix du client ===== */
const XF={scope:'estab',tab:'recap'};
function qStats(rs){const m={};rs.forEach(r=>stdsFor(r.format,r.channel).forEach(s=>{if(!['N','E','C'].includes(s.t))return;const v=r.answers[s.id];if(v!=='oui'&&v!=='non')return;const k=s.id;m[k]=m[k]||{s,plus:0,minus:0,hotel:r.hotel};v==='oui'?m[k].plus++:m[k].minus++}));return Object.values(m).map(x=>({...x,rate:Math.round(x.plus/(x.plus+x.minus)*100)}))}
const mean=(rs,f)=>{const v=rs.map(f).filter(x=>x!=null);return v.length?Math.round(avg(v)):null};
function lineChart(rs){
 const W=900,H=260,L=40,R=20,T=16,B=36;const xs=i=>L+i*(W-L-R)/11;const ys=v=>T+(100-v)*(H-T-B)/100;const y=TODAY.slice(0,4);
 const pts=MS.map((m,i)=>{const x=rs.filter(r=>(r.from||'').startsWith(y+'-'+String(i+1).padStart(2,'0')));return x.length?[xs(i),ys(Math.round(avg(x.map(r=>r.score))))]:null});
 const path=pts.filter(Boolean).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Note moyenne par mois ${y}"><rect width="${W}" height="${H}" fill="#fff"/>${[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="#d6dccb" stroke-width=".67"/><text x="${L-6}" y="${ys(v)+4}" font-size="12" fill="#5c6456" text-anchor="end">${v}</text>`).join('')}<line x1="${L}" x2="${W-R}" y1="${ys(OBJ)}" y2="${ys(OBJ)}" stroke="#974528" stroke-dasharray="5 4"/><text x="${W-R}" y="${ys(OBJ)-6}" font-size="12" fill="#974528" text-anchor="end">objectif ${OBJ} %</text>${MS.map((m,i)=>`<text x="${xs(i)}" y="${H-12}" font-size="12" fill="#5c6456" text-anchor="middle">${m}</text>`).join('')}${path?`<path d="${path}" fill="none" stroke="#2a371f" stroke-width="2.5"/>`:''}${pts.filter(Boolean).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#9db49d" stroke="#2a371f" stroke-width="1.5"/>`).join('')}</svg>`}
function recap(){
 const rs=officialReports().filter(r=>XF.scope==='group'||r.hotel===S.estab);const y=TODAY.slice(0,4);const ytd=rs.filter(r=>(r.from||'').startsWith(y));
 const g=mean(rs,r=>r.score);const st=qStats(ytd);
 const top=[...st].sort((a,b)=>b.rate-a.rate||b.plus-a.plus).slice(0,10);const flop=st.filter(x=>x.minus>0).sort((a,b)=>a.rate-b.rate||b.minus-a.minus).slice(0,10);
 const qRow=(x,i)=>`<tr><td>${i+1}</td><td>${esc(qText(x.s,XF.scope==='group'?'':S.estab))}<div class="small">${esc(x.s.sec)} · ${TLABEL[x.s.t]}</div></td><td>${scorePill(x.rate)}</td><td><span class="up">+${x.plus}</span> / <span class="down">−${x.minus}</span></td></tr>`;
 const byHotel=HOTELS.map(h=>{const x=officialReports().filter(r=>r.hotel===h);return {h,n:x.length,v:mean(x,r=>r.score),feel:mean(x,r=>r.sc.feel),brand:mean(x,r=>r.sc.brand),crit:x.reduce((a,r)=>a+r.sc.crit.length,0)}}).sort((a,b)=>(b.v??-1)-(a.v??-1));
 return `<div class="grid g4"><div class="kpi"><div class="t">Moyenne globale</div><div class="v">${g==null?'n/a':g+' %'}</div><div class="c">objectif ${OBJ} % · ${rs.length} audit${rs.length>1?'s':''}</div></div><div class="kpi"><div class="t">Critiques ratées</div><div class="v" style="color:var(--terra)">${rs.reduce((a,r)=>a+r.sc.crit.length,0)}</div><div class="c">${openCrit().filter(p=>XF.scope==='group'||p.hotel===S.estab).length} plan(s) ouvert(s)</div></div><div class="kpi"><div class="t">Indice ressenti</div><div class="v">${idx(mean(rs,r=>r.sc.feel))}</div><div class="c">hors note</div></div><div class="kpi"><div class="t">Avis moyen</div><div class="v">${(()=>{const v=rs.map(r=>r.sc.stars).filter(Boolean);return v.length?(avg(v)).toFixed(1).replace('.',',')+' ★':'n/a'})()}</div><div class="c">avis fictif type Booking</div></div></div>
 <div class="grid g3" style="margin-top:16px"><div class="kpi"><div class="t">Fondamentaux de marque</div><div class="v">${(v=>v==null?'n/a':v+' %')(mean(rs,r=>r.sc.brand))}</div></div><div class="kpi"><div class="t">Upselling</div><div class="v">${(v=>v==null?'n/a':v+' %')(mean(rs,r=>r.sc.upsell))}</div><div class="c">propositions faites / occasions</div></div><div class="kpi"><div class="t">Parcours digital</div><div class="v">${(v=>v==null?'n/a':v+' %')(mean(rs,r=>r.sc.digital))}</div><div class="c">transmis au marketing digital</div></div></div>
 <div class="kpi" style="margin-top:16px"><div class="t">Performance par section, avec le ressenti client</div><div class="tblbox" style="margin-top:10px"><table><thead><tr><th>Section</th><th>Note moyenne</th><th>Écart à l'objectif</th><th>Ressenti</th></tr></thead><tbody>${SECTIONS.map(s=>{const v=mean(rs,r=>r.sc.secPct[s]);return `<tr><td>${esc(s)}</td><td>${scorePill(v)}</td><td>${v==null?'—':`<b class="${v>=OBJ?'up':'down'}">${v-OBJ>=0?'+':''}${v-OBJ} pts</b>`}</td><td>${idx(mean(rs,r=>r.sc.secFeel[s]))}</td></tr>`}).join('')}<tr><td><b style="font-weight:500">Note globale</b></td><td>${scorePill(g)}</td><td>${g==null?'—':`<b class="${g>=OBJ?'up':'down'}">${g-OBJ>=0?'+':''}${g-OBJ} pts</b>`}</td><td>${idx(mean(rs,r=>r.sc.feel))}</td></tr></tbody></table></div></div>
 <div class="grid g2" style="margin-top:16px"><div class="kpi"><div class="t">Top 10 des points forts <span class="small">· YTD ${y}</span></div>${top.length?`<div class="tblbox" style="margin-top:10px"><table><thead><tr><th>#</th><th>Question</th><th>Réussite</th><th>YTD+ / YTD−</th></tr></thead><tbody>${top.map(qRow).join('')}</tbody></table></div>`:'<p><em class="e">Pas encore de données.</em></p>'}</div><div class="kpi"><div class="t">Top 10 des points à améliorer <span class="small">· YTD ${y}</span></div>${flop.length?`<div class="tblbox" style="margin-top:10px"><table><thead><tr><th>#</th><th>Question</th><th>Réussite</th><th>YTD+ / YTD−</th></tr></thead><tbody>${flop.map(qRow).join('')}</tbody></table></div>`:'<p><em class="e">Aucun point non conforme.</em></p>'}</div></div>
 <div class="kpi" style="margin-top:16px"><div class="t">Note moyenne par mois · ${y}</div><div style="margin-top:10px">${lineChart(rs)}</div></div>
 <div class="kpi" style="margin-top:16px"><div class="t">Classement des hôtels</div><div class="tblbox" style="margin-top:10px"><table><thead><tr><th>#</th><th>Hôtel</th><th>Audits</th><th>Note</th><th>Ressenti</th><th>Marque</th><th>Critiques</th></tr></thead><tbody>${byHotel.map((h,i)=>`<tr class="row" onclick="setEstab('${esc(h.h)}')"><td>${h.v==null?'—':i+1}</td><td>${esc(h.h)}</td><td>${h.n} / 12</td><td>${scorePill(h.v)}</td><td>${idx(h.feel)}</td><td>${h.brand==null?'n/a':h.brand+' %'}</td><td>${h.crit?`<span class="pill red">${h.crit}</span>`:'0'}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function trimestriel(){
 const all=officialReports().filter(r=>r.hotel===S.estab).sort((a,b)=>(a.from||'').localeCompare(b.from||''));const l3=all.slice(-3);
 if(!l3.length)return `<div class="greybox"><span style="font-size:28px">🗓️</span>Aucun audit officiel pour ${esc(S.estab)}. Le bilan trimestriel s'appuie sur les trois derniers audits.</div>`;
 const fails={};l3.forEach(r=>stdsFor(r.format,r.channel).forEach(s=>{if(['N','E','C'].includes(s.t)&&r.answers[s.id]==='non'){fails[s.id]=fails[s.id]||{s,n:0};fails[s.id].n++}}));
 const rec=Object.values(fails).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n);const pon=Object.values(fails).filter(x=>x.n===1);
 const first=l3[0],last=l3[l3.length-1];const d=last.score-first.score;
 const rows=[['Note globale',r=>scorePill(r.score)],...SECTIONS.map(s=>[s,r=>scorePill(r.sc.secPct[s])]),['Critiques ratées',r=>r.sc.crit.length?`<span class="pill red">${r.sc.crit.length}</span>`:'0'],['Indice ressenti',r=>idx(r.sc.feel)],['Marque',r=>r.sc.brand==null?'n/a':r.sc.brand+' %'],['Upselling',r=>r.sc.upsell==null?'n/a':r.sc.upsell+' %'],['Avis',r=>r.sc.stars?starsTxt(r.sc.stars):'n/a']];
 const txt=`Bilan trimestriel · ${S.estab} · ${l3.map(r=>fm(r.from)).join(', ')}\nNote : ${l3.map(r=>r.score+' %').join(' → ')} (${d>=0?'+':''}${d} pts, objectif ${OBJ} %)\nProblèmes récurrents (2 audits sur 3 ou plus) :\n${rec.map(x=>'- '+qText(x.s,S.estab)+' ('+x.n+'/3)').join('\n')||'- aucun'}\nProblèmes ponctuels : ${pon.length}\nCritiques ratées sur la période : ${l3.reduce((a,r)=>a+r.sc.crit.length,0)}`;
 return `<p class="sub" style="margin:0 0 12px">${esc(S.estab)} · ${l3.length} dernier${l3.length>1?'s':''} audit${l3.length>1?'s':''} officiel${l3.length>1?'s':''}. Un problème vu sur 2 audits ou plus est une tendance, pas un incident.</p>
 <div class="tblbox"><table><thead><tr><th></th>${l3.map(r=>`<th>${FORMATS[r.format].ico} ${fm(r.from)}<br><small>${CHANNELS[r.channel].l}</small></th>`).join('')}</tr></thead><tbody>${rows.map(([l,f])=>`<tr><td>${l}</td>${l3.map(r=>`<td>${f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <div class="grid g3" style="margin-top:16px"><div class="kpi"><div class="t">Tendance</div><div class="v ${d>=0?'up':'down'}">${d>=0?'↗ +':'↘ '}${d} pts</div><div class="c">${fm(first.from)} → ${fm(last.from)}</div></div><div class="kpi"><div class="t">Problèmes récurrents</div><div class="v" style="color:${rec.length?'var(--terra)':'var(--green)'}">${rec.length}</div><div class="c">non conformes sur 2 audits ou plus</div></div><div class="kpi"><div class="t">Problèmes ponctuels</div><div class="v">${pon.length}</div><div class="c">vus une seule fois</div></div></div>
 <div class="kpi" style="margin-top:16px"><div class="t">Actions correctives prioritaires</div>${rec.length?`<ul style="margin:8px 0 0;padding-left:18px">${rec.map(x=>`<li>${esc(qText(x.s,S.estab))} <span class="pill ${x.s.t==='C'?'red':'orange'}">${x.n} / ${l3.length}</span></li>`).join('')}</ul>`:'<p class="sub">Aucun problème récurrent sur la période.</p>'}
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${rec.length?`<button class="btn" onclick="newPlan(null,STANDARDS.filter(s=>[${rec.map(x=>x.s.id).join(',')}].includes(s.id)),'Bilan trimestriel · ${esc(S.estab).replace(/'/g,"\\'")} · ${fm(last.from)}')">Créer le plan d'actions prioritaires</button>`:''}<button class="btn sec" onclick="copyTxt(${JSON.stringify(txt).replace(/"/g,'&quot;')})">Copier le bilan</button></div></div>`;
}
function voix(){
 const rs=officialReports().filter(r=>XF.scope==='group'||r.hotel===S.estab).filter(r=>r.sc.stars).sort((a,b)=>(b.from||'').localeCompare(a.from||''));
 const reasons={};officialReports().filter(r=>XF.scope==='group'||r.hotel===S.estab).forEach(r=>{if(r.sc.reason)reasons[r.sc.reason]=(reasons[r.sc.reason]||0)+1});const tot=Object.values(reasons).reduce((a,b)=>a+b,0);
 const np=officialReports().filter(r=>(XF.scope==='group'||r.hotel===S.estab)&&r.sc.nps!=null).map(r=>r.sc.nps);const nps=np.length?Math.round((np.filter(x=>x>=9).length-np.filter(x=>x<=6).length)/np.length*100):null;
 const A=(r,k)=>{const s=stdsFor(r.format,r.channel).find(x=>x.t==='A'&&x.k===k);return s?r.answers[s.id]:null};
 return `<div class="grid g3"><div class="kpi"><div class="t">Avis moyen</div><div class="v">${rs.length?avg(rs.map(r=>r.sc.stars)).toFixed(1).replace('.',',')+' ★':'n/a'}</div><div class="c">${rs.length} avis</div></div><div class="kpi"><div class="t">Score de recommandation</div><div class="v">${nps==null?'n/a':(nps>0?'+':'')+nps}</div><div class="c">% notes 9-10 − % notes 0-6</div></div><div class="kpi"><div class="t">Prix jugé juste</div><div class="v">${(v=>v==null?'n/a':v.toFixed(1).replace('.',',')+' / 5')((x=>x.length?avg(x):null)(officialReports().filter(r=>XF.scope==='group'||r.hotel===S.estab).map(r=>r.sc.price).filter(Boolean)))}</div></div></div>
 <div class="kpi" style="margin-top:16px"><div class="t">Pourquoi nos clients nous choisiraient</div>${tot?Object.entries(reasons).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.round(v/tot*100)}%"></i></div><span class="num2">${Math.round(v/tot*100)} %</span></div>`).join(''):'<p><em class="e">Pas encore de réponse.</em></p>'}</div>
 <h2 class="blk">Derniers avis</h2>${rs.length?rs.slice(0,8).map(r=>`<div class="review"><div class="rv-h"><span class="rv-score">${r.sc.stars}<small>/5</small></span><div><div class="rv-stars">${starsTxt(r.sc.stars)}</div><b>${esc((A(r,'title')||{}).txt||'Avis sans titre')}</b><div class="small">${esc(r.hotel)} · ${FORMATS[r.format].l} · ${fm(r.from)}</div></div></div>${(A(r,'pos')||{}).txt?`<p><span class="rv-p">＋</span>${esc(A(r,'pos').txt)}</p>`:''}${(A(r,'neg')||{}).txt?`<p><span class="rv-n">－</span>${esc(A(r,'neg').txt)}</p>`:''}</div>`).join(''):'<p><em class="e">Les avis des clients mystère apparaîtront ici.</em></p>'}`;
}
function performances(){
 return `<section class="card"><div class="head"><div>${crumb('')}<h1>Performances</h1><p class="sub">Un outil de mesure : récapitulatif par section, bilan des 3 derniers audits, voix du client.</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="switch"><button class="${XF.scope==='estab'?'on':''}" onclick="XF.scope='estab';render()">${esc(S.estab)}</button><button class="${XF.scope==='group'?'on':''}" onclick="XF.scope='group';render()">Tous les hôtels</button></div><button class="round" aria-label="Exporter les données" title="Exporter les données" onclick="exportPerf()">⭳</button></div></div>
 <div class="tabs"><button class="${XF.tab==='recap'?'on':''}" onclick="XF.tab='recap';render()">📊 Récapitulatif</button><button class="${XF.tab==='trim'?'on':''}" onclick="XF.tab='trim';render()">🗓️ Bilan trimestriel</button><button class="${XF.tab==='voix'?'on':''}" onclick="XF.tab='voix';render()">⭐ Voix du client</button></div>
 ${XF.tab==='trim'?trimestriel():XF.tab==='voix'?voix():recap()}</section>`;
}
function exportPerf(){const head=['Hôtel','Format','Réservation','Séjour','Auditeur','Statut','Note','Critiques',...SECTIONS,'Ressenti','Marque','Upselling','Digital','Avis','Recommandation'];
 const csv=[head.join(';'),...officialReports().map(r=>[r.hotel,FORMATS[r.format].l,CHANNELS[r.channel].l,fm(r.from),r.auditor,STATUS[r.status][0],r.score,r.sc.crit.length,...SECTIONS.map(s=>r.sc.secPct[s]??''),r.sc.feel??'',r.sc.brand??'',r.sc.upsell??'',r.sc.digital??'',r.sc.stars??'',r.sc.nps??''].join(';'))].join('\n');
 (navigator.clipboard?navigator.clipboard.writeText(csv):Promise.reject()).then(()=>toast('Données copiées, à coller dans Excel')).catch(()=>toast('Export préparé'))}

/* ===== Paramètres ===== */
const SF={tab:'conf',q:''};
function settings(){
 let body='';
 if(SF.tab==='compte')body=`<div class="grid g2"><div class="field"><label class="lbl" for="pw1">Nouveau mot de passe</label><input type="password" id="pw1"></div><div class="field"><label class="lbl" for="pw2">Confirmation</label><input type="password" id="pw2"></div></div><div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="btn" onclick="savePw()">Enregistrer</button></div>`;
 else if(SF.tab==='users'){const us=USERS.filter(u=>!SF.q||(u.name+u.email).toLowerCase().includes(SF.q.toLowerCase()));body=`<div class="search"><input type="search" id="u-q" placeholder="Rechercher…" value="${esc(SF.q)}" oninput="SF.q=this.value;render();document.getElementById('u-q').focus()"></div>${us.map(u=>`<div class="ucard"><span class="av ${u.me?'me':''}">${u.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</span><div class="inf"><span style="font-weight:500">${esc(u.name)}${u.me?' <span class="small">(Vous)</span>':''}</span><small>${esc(u.email)}</small></div><div class="rt"><span class="pill red">${esc(u.role)}</span><span>◷ ${u.last||'Aucune activité'}</span></div></div>`).join('')}<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="addUser()">Ajouter un utilisateur</button></div>`}
 else body=`<div class="grid g3"><div class="kpi"><div class="t">Hôtels <span class="pill">${HOTELS.length}</span></div><div class="pills">${HOTELS.map(h=>`<span class="pill">${esc(h)}</span>`).join('')}</div></div><div class="kpi"><div class="t">Modes de réservation <span class="pill">3</span></div><div class="pills">${Object.values(CHANNELS).map(c=>`<span class="pill">${c.l}</span>`).join('')}</div></div><div class="kpi"><div class="t">Moments du parcours client <span class="pill">${STAGES.length}</span></div><div class="pills">${STAGES.map(st=>`<span class="pill">${st.ico} ${st.title}</span>`).join('')}</div></div></div>
 <div class="kpi" style="margin-top:16px"><div class="t">Barème appliqué</div><p class="sub">Normale 1 pt, Essentielle 3 pts, Critique 3 pts et, si ratée, statut rouge, plan à traiter sous 15 jours avec photo de la correction, −3 pts sur la note globale. Buffet : 26 pts répartis entre les produits. Un bonus par section (+1 pt), retenu seulement si le fait est décrit, plafonné à 100 %. Sans objet retiré du calcul, arrondi normal. Chaque section pèse 20 %. Objectif ${OBJ} %.</p><p class="sub">À côté de la note, sans la modifier : ressenti (notes sur 5, indice /100), fondamentaux de marque, upselling, avis fictif type Booking, sondage client, parcours digital (marketing digital) et conciergerie.</p></div>
 <div class="kpi" style="margin-top:16px"><div class="t">Points restant à cadrer (compte rendu de réunion)</div><ul class="sub" style="margin:8px 0 0;padding-left:18px"><li>Pondération des critères essentiels et des critères liés à la marque.</li><li>Format des questions de sondage et de la notation fictive (proposés ici, à valider).</li><li>Périmètre et protocole de test du parcours digital.</li><li>Format de restitution des bilans trimestriels (proposé dans Performances).</li><li>Circuit de validation des rapports avec l'auditeur (proposé : Reçu → Relecture → Validé → Diffusé).</li><li>${STANDARDS.filter(s=>s.nouv).length} nouvelles questions à valider avec Lucien, 2 bonus à valider avec Boris.</li></ul></div>`;
 return `<section class="card"><div class="head"><div>${crumb('')}<h1>Paramètres</h1><p class="sub">Organisez l'application selon vos besoins</p></div></div><div class="tabs"><button class="${SF.tab==='conf'?'on':''}" onclick="SF.tab='conf';render()">Configuration</button><button class="${SF.tab==='users'?'on':''}" onclick="SF.tab='users';render()">Utilisateurs</button><button class="${SF.tab==='compte'?'on':''}" onclick="SF.tab='compte';render()">Compte</button></div>${body}</section>`;
}
function savePw(){const a=document.getElementById('pw1').value,b=document.getElementById('pw2').value;if(!a){toast('Saisissez un mot de passe');return}if(a!==b){toast('La confirmation ne correspond pas');return}toast('Mot de passe enregistré')}
function addUser(){openModal(`<h2>Ajouter un utilisateur</h2><div class="grid g2" style="margin-top:16px"><div class="field"><label class="lbl" for="au-n">Nom et prénom</label><input type="text" id="au-n"></div><div class="field"><label class="lbl" for="au-e">E-mail</label><input type="text" id="au-e"></div></div>${selField('Rôle',['Administrateur','Auditeur','Lecteur'],'au-r')}<div class="mfoot" style="justify-content:flex-end"><button class="btn sec" onclick="closeAll()">Annuler</button><button class="btn" onclick="doAddUser()">Ajouter</button></div>`)}
function doAddUser(){const n=document.getElementById('au-n').value.trim();if(!n){toast('Indiquez un nom');return}USERS.push({name:n,email:document.getElementById('au-e').value,role:document.getElementById('au-r').value,last:null});closeAll();toast('Utilisateur ajouté');render()}

/* ===== Aide ===== */
function help(){
 const rows=[['Programmer les audits de l\'année','Planification','Programme annuel : une case par hôtel et par mois, « + » pour planifier','planning'],['Lancer un audit client mystère','Librairie','« + Nouvel audit » → format → hôtel → réservation → dates → qui réalise','checklists'],['Envoyer l\'invitation au client mystère','Planification',"« ✉️ E-mail » sur la ligne de l'audit",'planning'],['Relire un rapport avec l\'auditeur','Rapports','ouvrir le rapport → « Envoyer en relecture à l\'auditeur »','reports'],['Diffuser un rapport à l\'hôtel','Rapports','après validation → « Diffuser à l\'hôtel »','reports'],["Récupérer les réponses d'un client non invité",'Rapports','« Importer un code de réponses »','reports'],['Traiter une critique sous 15 jours',"Plans d'action",'plan ouvert automatiquement, photo de la correction pour chaque action','action-plans'],['Préparer le bilan trimestriel','Performances','onglet « Bilan trimestriel » : 3 derniers audits, problèmes récurrents','performances'],['Voir le top 10 et les sections','Performances','onglet « Récapitulatif »','performances'],['Lire les avis des clients mystère','Performances','onglet « Voix du client »','performances'],["Changer d'hôtel",'En-tête','pilule en haut à droite','']];
 return `<section class="card help"><div class="head"><div>${crumb('')}<h1>Où se trouve quoi</h1><p class="sub">Un audit = un séjour complet : un format, un hôtel, un mode de réservation, des dates. Le client répond moment par moment, le siège relit le rapport avec lui, puis le diffuse à l'hôtel.</p></div></div><div class="tblbox"><table><thead><tr><th>Je veux…</th><th>Où</th><th>Comment</th></tr></thead><tbody>${rows.map(r=>`<tr ${r[3]?`class="row" onclick="go('${r[3]}')"`:''}><td style="font-weight:500">${r[0]}</td><td>${r[1]}</td><td class="small">${r[2]}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ===== Stockage (base partagée si disponible, sinon navigateur) et démarrage ===== */
const DBS={db:null,user:null,assets:null,canWrite:null};
const useCap=async n=>{try{return (window.claude&&window.claude.use)?await window.claude.use(n):null}catch(e){return null}};
const LS='alfred-audit-data-v2';
function persist(){try{localStorage.setItem(LS,JSON.stringify({AUDITS,REPORTS,PLANS}))}catch(e){}}
function restoreLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(!d)return;(d.AUDITS||[]).forEach(a=>{if(!AUDITS.some(x=>x.id===a.id))AUDITS.push(a)});(d.REPORTS||[]).forEach(r=>{if(!REPORTS.some(x=>x.id===r.id)){r.sc=computeScore(r.format,r.channel,r.answers,r.comments);if(!STATUS[r.status])r.status='recu';REPORTS.push(r)}});(d.PLANS||[]).forEach(p=>{if(!PLANS.some(x=>x.id===p.id))PLANS.push(p)})}catch(e){}}
function saveMeta(r){persist();if(DBS.db){try{DBS.db.doc('reportmeta/'+r.id).set({status:r.status,review:r.review||null,diffusedAt:r.diffusedAt||null})}catch(e){}}}
function savePlan(p){persist();if(DBS.db){try{DBS.db.doc('plans/'+p.id).set(p)}catch(e){}}}
let render=()=>{renderNav();const V={dashboard,checklists,checklist,audit,planning,reports,report,'action-plans':plans,plan,performances,settings,help};document.getElementById('app').innerHTML=(V[S.page]||dashboard)()};
function parseHash(){const mm=(location.hash||'').replace('#','').match(/^cm-(business|famille|couple)-([a-z]+)-(booking|telephone|site)-([a-z0-9]+)$/);return mm?{format:mm[1],hotel:hotelFromSlug(mm[2]),channel:mm[3],id:mm[4]}:null}
function clientMode(){
 const p=parseHash();if(!p)return false;
 document.getElementById('hdr').classList.add('client-hdr');document.querySelector('.brand').onclick=null;
 const a={id:p.id,format:p.format,hotel:p.hotel,channel:p.channel,client:'',from:'',to:'',notes:'',official:true};AUDITS.push(a);loadQ(a,true);
 render=()=>{document.getElementById('app').innerHTML=questionnaire(true)};render();
 (async()=>{DBS.db=await useCap('db');DBS.user=await useCap('user');DBS.assets=await useCap('assets');if(DBS.user){try{DBS.canWrite=await DBS.user.can('data.write')}catch(e){}}
  if(DBS.db){try{const s=await DBS.db.doc('audits/'+p.id).get();if(s.exists)Object.assign(a,s.data());const r=await DBS.db.doc('responses/'+p.id).get();if(r.exists){Q.done=true;Q.resp=r.data();const rv=await DBS.db.doc('reviews/'+p.id).get();if(rv.exists)Q.review=rv.data()}else{const d=await DBS.db.doc('drafts/'+p.id).get();if(d.exists&&!Object.keys(Q.answers).length){const x=d.data();Q.answers=x.answers||{};Q.comments=x.comments||{};Q.defects=x.defects||[];Q.stageDone=x.stageDone||{}}}}catch(e){}}
  render()})();
 return true;
}
async function bootPlatform(){
 DBS.db=await useCap('db');DBS.assets=await useCap('assets');if(!DBS.db)return;
 const merge=(arr,m)=>{const i=arr.findIndex(x=>x.id===m.id);if(i<0)arr.push(m);else Object.assign(arr[i],m)};
 try{DBS.db.collection('audits').onSnapshot(snap=>{snap.docs.forEach(d=>merge(AUDITS,d.data()));render()},()=>{});
  DBS.db.collection('responses').onSnapshot(snap=>{snap.docs.forEach(d=>ingestResponse(d.data()));render()},()=>{});
  DBS.db.collection('plans').onSnapshot(snap=>{snap.docs.forEach(d=>merge(PLANS,d.data()));render()},()=>{});
  DBS.db.collection('reportmeta').onSnapshot(snap=>{snap.docs.forEach(d=>{META[d.id]=d.data();const r=REPORTS.find(x=>x.id===d.id);if(r)Object.assign(r,d.data())});render()},()=>{});
  DBS.db.collection('reviews').onSnapshot(snap=>{snap.docs.forEach(d=>{const v=d.data();REVIEWS[d.id]=v;const r=REPORTS.find(x=>x.audit===d.id);if(r){r.review=Object.assign({},r.review,v);if(v.status==='confirmed'&&r.status==='relecture'){r.status='valide';saveMeta(r)}}});render()},()=>{});}catch(e){}
}
if(!clientMode()){restoreLocal();render();bootPlatform()}

</script>
