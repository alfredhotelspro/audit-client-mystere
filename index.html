.bgveil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,253,240,.55),rgba(255,253,240,.25) 30%,rgba(255,253,240,.25) 70%,rgba(255,253,240,.55))}
h1,h2{font-family:var(--fh);font-weight:600;margin:0;text-wrap:balance;color:var(--title)}
h1{font-size:28px;line-height:1.2}
header.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:60px;z-index:50;background:rgba(255,253,240,.96);border-bottom:.67px solid var(--line);display:flex;align-items:center;gap:8px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;font-family:var(--fh);font-weight:600;font-size:16px;color:var(--navy);padding:0;white-space:nowrap}
.brand .p{width:32px;height:32px;border-radius:9px;background:var(--wine);color:#fffdf0;display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:17px;flex:none}
nav.main{display:flex;gap:4px;margin-left:16px}
nav.main a{padding:8px 12px;border-radius:9999px;color:var(--navy);font:500 14px var(--fb);cursor:pointer;text-decoration:none}
nav.main a:hover{background:var(--field)} nav.main a.on{background:var(--sage-bg)}
.spacer{flex:1}
.seal{width:34px;height:34px;border-radius:50%;background:var(--terra);color:#fffdf0;display:grid;place-items:center;font-family:"Georgia",serif;font-style:italic;font-size:17px;flex:none}
.estab{height:36px;border-radius:9999px;background:var(--sage-bg);border:0;color:var(--navy);font:500 14px var(--fb);padding:0 14px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.avbtn{display:flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--navy);padding:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:13px;background:var(--terra-bg);color:var(--terra);flex:none}
.av.me{background:var(--navy);color:#fffdf0}
.hamb{display:none;background:none;border:0;color:var(--navy);font-size:22px;cursor:pointer;padding:6px 4px;flex:none;margin-right:-4px}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-block:88px 28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border-radius:25px;padding:24px;border:.67px solid var(--line)}
.card+.card{margin-top:16px}
.sub{color:var(--grey);font-size:14px;margin:4px 0 0}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;padding-bottom:16px;border-bottom:.67px solid var(--line);margin-bottom:20px}
.crumb{font-size:12px;color:var(--grey);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:9999px;border:0;background:var(--navy);color:#fffdf0;font:500 14px/1.2 var(--fb);cursor:pointer;text-decoration:none;text-align:center;max-width:100%}
.btn.sec{background:var(--field);color:var(--navy)}
.btn.sm{min-height:32px;padding:5px 14px}
.btn.outl{background:#fff;border:.67px solid var(--line);color:var(--navy)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.lbl{font:500 14px var(--fb);color:var(--navy);display:block;margin-bottom:6px}
.field{display:flex;flex-direction:column;min-width:0}
select,input[type=search],input[type=text],input[type=password],input[type=date],input[type=month],textarea{height:36px;border-radius:9999px;border:0;background:var(--field);color:var(--ink);font:400 14px var(--fb);padding:0 14px;width:100%;min-width:0}
textarea{height:auto;min-height:80px;border-radius:16px;padding:10px 14px;resize:vertical}
select{appearance:none;padding-right:34px}
.sel{position:relative}.sel::after{content:"⌄";position:absolute;right:14px;top:50%;transform:translateY(-60%);pointer-events:none;color:var(--navy)}
.search{position:relative}.search input{padding-left:36px}.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.band{background:var(--field);border-radius:9999px;padding:8px 16px;font-size:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:16px 0}
.band b{font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.d-or{background:var(--orange)}.d-bl{background:var(--navy)}.d-gr{background:var(--sage)}.d-gy{background:#b9bdb3}.d-rd{background:var(--terra)}
.switch{display:inline-flex;background:var(--field);border-radius:9999px;padding:3px;gap:2px;height:36px}
.switch button{border:0;background:transparent;border-radius:9999px;padding:0 14px;color:var(--navy);font:500 14px var(--fb);cursor:pointer;display:flex;align-items:center;gap:6px}
.switch button.on{background:#fff}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--field);color:var(--navy);cursor:pointer;font-size:15px;display:grid;place-items:center;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--grey);font-size:14px}
.ico-round{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
em.e{font-style:italic;color:var(--navy)}
.kpi{position:relative;background:#fff;border:.67px solid var(--line);border-radius:25px;padding:24px}
.kpi .t{font:500 15px var(--fb);color:var(--navy)}.kpi .ic{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;background:var(--sage-bg);display:grid;place-items:center;font-size:16px}
.kpi .v{font:700 28px var(--fh);margin-top:12px;color:var(--navy)}.kpi .c{font-size:12px;color:var(--grey);margin-top:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.mtag{border-radius:10px;padding:6px 14px;font-weight:500;color:#fff;background:#e6cfc3}.mtag.cur{background:var(--terra)}
.mval{color:var(--terra);font-weight:500}.mval.p{color:#c9a08e}
.greybox{background:var(--sage-bg);border-radius:20px;min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--navy);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:3px 10px;font-size:12px;background:var(--field);color:var(--navy);white-space:nowrap}
.pill.green{background:var(--sage-bg);color:var(--green)}.pill.red{background:var(--terra-bg);color:var(--terra)}.pill.orange{background:#f6e9d9;color:var(--orange)}.pill.blue{background:var(--sage-bg);color:var(--navy)}
.fmt{display:flex;gap:16px;background:#fff;border:.67px solid var(--line);border-radius:25px;padding:16px;align-items:center;flex-wrap:wrap}
.fmt .ph{width:120px;height:120px;border-radius:20px;flex:none;display:grid;place-items:center;font-size:40px}
.fmt .ph.business{background:linear-gradient(135deg,var(--sage),var(--navy))}.fmt .ph.famille{background:linear-gradient(135deg,#e6cfc3,var(--terra))}.fmt .ph.couple{background:linear-gradient(135deg,#c9b9a0,var(--wine))}
.fmt .body{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.fmt .ttl{font:600 18px var(--fh);color:var(--navy)}.fmt .m1{font-size:13px;color:var(--grey)}
.fmt .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sec-head{display:flex;justify-content:space-between;align-items:center;border:.67px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:8px 14px;margin:20px 0 12px;font:500 15px var(--fb);color:var(--navy)}
.q{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;background:#fff;border:.67px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.q .num{width:32px;height:32px;border-radius:50%;background:var(--sage-bg);display:grid;place-items:center;font-size:13px;color:var(--navy);font-weight:500}

}

/* ===== Questionnaire : parcours en étapes (client mystère et audit interne) ===== */
const Q={a:null,answers:{},comments:{},photos:{},defects:[],stageDone:{},view:'home',stage:null,done:false,code:'',client:false,saved:''};
function qKey(){return 'q-'+Q.a.id}
function saveQ(silent){Q.saved=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});try{localStorage.setItem(qKey(),JSON.stringify({answers:Q.answers,comments:Q.comments,photos:Q.photos,defects:Q.defects,stageDone:Q.stageDone,done:Q.done,code:Q.code}))}catch(e){}
 if(DBS.db&&DBS.canWrite!==false&&!Q.done){clearTimeout(Q._t);Q._t=setTimeout(async()=>{try{await DBS.db.doc('drafts/'+Q.a.id).set({answers:Q.answers,comments:Q.comments,stageDone:Q.stageDone,defects:Q.defects.map(d=>({caption:d.caption,id:d.id,url:d.url})),updated:new Date().toISOString()});const d=AUDITS.find(x=>x.id===Q.a.id);if(d&&d.status==='nd'){d.status='ec';try{await DBS.db.doc('audits/'+Q.a.id).update({status:'ec'})}catch(e){}}}catch(e){}},1200)}
 if(!silent)toast('Enregistré · vous pouvez reprendre plus tard')}
function loadQ(a,client){Q.a=a;Q.client=!!client;Q.answers={};Q.comments={};Q.photos={};Q.defects=[];Q.stageDone={};Q.view='home';Q.stage=null;Q.done=false;Q.code='';try{const s=localStorage.getItem(qKey());if(s)Object.assign(Q,JSON.parse(s))}catch(e){}}
function startInternal(id){const a=AUDITS.find(x=>x.id===id);loadQ(a,false);if(a.status==='nd')a.status='ec';go('audit',{id})}
function qList(){return stdsFor(Q.a.format,Q.a.channel)}
const isAnswered=s=>{const v=Q.answers[s.id];return s.t==='R'?!!(v&&v.n):!!v};
function audit(){if(!Q.a||Q.a.id!==S.params.id){const a=AUDITS.find(x=>x.id===S.params.id);if(!a)return checklists();loadQ(a,false)}return questionnaire(false)}
function openStage(k){Q.view='stage';Q.stage=k;render();window.scrollTo(0,0)}
function questionnaire(client){
 const a=Q.a;const list=qList();const answered=list.filter(isAnswered).length;const total=list.length;const ch=CHANNELS[a.channel];
 if(Q.done)return `<section class="card"><div class="eyebrow">Alfred Hotels · Client mystère</div><h1 style="font-size:24px;margin-top:6px">Merci, votre questionnaire est transmis</h1><p class="sub">${esc(auditLabel(a))}</p>${Q.code?`<div class="notice warn" style="margin-top:16px"><b style="font-weight:500">Dernière étape : envoyez ce code de réponses à l'équipe Alfred Hotels</b><p style="margin:6px 0 0">Copiez-le dans un e-mail à <b style="font-weight:500">operation@alfredhotels.com</b>${Q.defects.length?' et joignez vos '+Q.defects.length+' photo(s) au même e-mail':''}.</p><div class="linkbox"><code style="max-height:120px;overflow:auto">${esc(Q.code)}</code><button class="btn sm" onclick="copyTxt(Q.code)">Copier le code</button></div></div>`:`<div class="notice" style="margin-top:16px">Vos réponses${Q.defects.length?' et vos '+Q.defects.length+' photo(s)':''} sont arrivées sur la plateforme Alfred Hotels. Vous pouvez fermer cette page.</div>`}</section>`;
 if(Q.view==='stage'&&Q.stage)return stageView(client);
 /* Accueil du parcours */
 const stDone=k=>{const g=list.filter(s=>s.st===k);const d=g.filter(isAnswered).length;return {g:g.length,d,pct:g.length?Math.round(d/g.length*100):100,ok:Q.stageDone[k]||(g.length&&d===g.length)}};
 const allDone=STAGES.every(st=>stDone(st.k).ok);
 return `<section class="card"><div class="head" style="border:0;padding-bottom:0;margin-bottom:0"><div><div class="eyebrow">Alfred Hotels · ${esc(a.hotel)} · ${FORMATS[a.format].l}${client?'':' · '+esc(a.client)}</div><h1 style="font-size:26px;margin-top:4px">${client?(answered?'Bon retour':'Bienvenue dans l\'expérience client mystère')+(a.client&&a.client!=='Client mystère'?', '+esc(a.client.split(' ')[0]):''):esc('Client Mystère - '+FORMATS[a.format].l)}</h1><p class="sub" style="font-size:15px">${client?`Votre séjour${a.from?' du '+fd(a.from)+' au '+fd(a.to):''} se déroule en ${STAGES.length} moments. À chaque moment, appuyez sur la case correspondante et répondez à quelques questions : 3 à 10 minutes, jamais plus. Vous choisissez l'ordre et le moment, tout est enregistré au fur et à mesure.`:`Séjour ${fm(a.from)} · réservation ${ch.l}. Remplissez chaque étape au moment où vous la vivez.`}</p></div>${client?'':`<button class="btn sec sm" onclick="saveQ();go('planning')">⏸ Pause</button>`}</div>
 <div class="progrow"><span><b style="font-weight:500;color:var(--navy)">Mon avancement</b><br>${answered} / ${total} réponses</span><div class="progress"><i style="width:${total?Math.round(answered/total*100):0}%"></i></div><span>${total?Math.round(answered/total*100):0} %</span><span class="pill">${Q.saved?'Enregistré à '+Q.saved:'Enregistrement automatique'}</span></div>

 <div class="jlist">${(()=>{let nextShown=false;return STAGES.map((st,i)=>{const x=stDone(st.k);if(!x.g)return '';const state=x.ok?'done':x.d?'going':'todo';const isNext=!x.ok&&!nextShown;if(isNext)nextShown=true;return `<button class="jcard ${state} ${isNext?'next':''}" onclick="openStage('${st.k}')"><span class="jnum">${x.ok?'✓':i+1}</span><span class="jico">${st.ico}</span><span class="jbody"><b>${st.me}</b><small>${st.when}${isNext&&!x.d?' · <span style="color:var(--terra)">suggéré maintenant</span>':''}</small>${state==='going'?`<span class="jbar"><i style="width:${x.pct}%"></i></span>`:''}</span><span class="jright">${x.ok?'<span class="pill green">Terminé · revoir</span>':x.d?`<span class="pill orange">${x.g-x.d} restante${x.g-x.d>1?'s':''}</span>`:`<span class="pill">${x.g} question${x.g>1?'s':''} · ${Math.max(2,Math.round(x.g/4))} min</span>`}<span class="jarrow">›</span></span></button>`}).join('')})()}</div>
 <div class="sec-head" style="margin-top:20px"><span>📷 Mes photos des défauts et manques</span><span class="pill">${Q.defects.length}</span></div>
 <p class="sub" style="margin:0 0 10px">À tout moment du séjour : un élément absent du buffet, une ampoule grillée, un joint abîmé. Une légende courte suffit.</p>
 <label class="drop"><input type="file" accept="image/*" multiple hidden onchange="addDefects(this)">📷 Ajouter des photos</label>
 ${Q.defects.length?`<div class="photos">${Q.defects.map((p,k)=>`<div class="photo"><img src="${p.url||p.data||''}" alt=""><input type="text" placeholder="Légende (ex. pas de jus d'orange)" value="${esc(p.caption||'')}" oninput="Q.defects[${k}].caption=this.value;saveQ(true)"><button class="btn sec sm" onclick="Q.defects.splice(${k},1);saveQ(true);render()">Retirer</button></div>`).join('')}</div>`:''}
 <div class="sec-head" style="margin-top:20px"><span>✍️ Pour finir</span></div>
 <div class="grid g2"><div class="field"><label class="lbl" for="cc-0">${client?'Votre nom et prénom':"Nom de l'auditeur"}</label><input type="text" id="cc-0" value="${esc(Q.comments.r0||a.client||'')}" oninput="Q.comments.r0=this.value;saveQ(true)"></div><div class="field"><label class="lbl" for="cc-1">Numéro de la chambre</label><input type="text" id="cc-1" value="${esc(Q.comments.r1||'')}" oninput="Q.comments.r1=this.value;saveQ(true)"></div><div class="field"><label class="lbl" for="cc-2">Collaborateurs rencontrés (prénom, poste)</label><input type="text" id="cc-2" value="${esc(Q.comments.r2||'')}" oninput="Q.comments.r2=this.value;saveQ(true)"></div><div class="field"><label class="lbl" for="cc-3">Impressions générales</label><textarea id="cc-3" oninput="Q.comments.r3=this.value;saveQ(true)">${esc(Q.comments.r3||'')}</textarea></div></div>
 <div class="stickybar"><span style="font-size:13px;color:var(--grey)">${allDone?'Toutes les étapes sont terminées.':STAGES.filter(st=>stDone(st.k).g&&!stDone(st.k).ok).length+' étape(s) à compléter'} · ${Q.defects.length} photo${Q.defects.length>1?'s':''}</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" onclick="saveQ()">💾 Enregistrer</button><button class="btn" id="q-send" onclick="submitQ()">Envoyer<span class="lg"> le questionnaire</span></button></div></div></section>`;
}
function stageView(client){
 const a=Q.a;const st=STAGE(Q.stage);const g=qList().filter(s=>s.st===st.k);const done=g.filter(isAnswered).length;const left=g.length-done;
 const i=STAGES.findIndex(x=>x.k===st.k);const next=STAGES.slice(i+1).find(x=>qList().some(s=>s.st===x.k));
 const buffet=g.filter(s=>s.t==='B');const others=g.filter(s=>s.t!=='B');
 const subs=[...new Set(others.map(s=>s.sub))];let n=0;
 const refTile=s=>{const r=s.ref&&REFS[s.ref];if(!r)return '';return `<div class="ref">${r.img?`<img class="refimg" src="${r.img}" alt="Référence" onclick="zoomRef('${r.img}','${esc(r.t)}')">`:`<span class="refimg" aria-hidden="true">📷</span>`}<span><b style="font-weight:500">À quoi ça doit ressembler</b><br>${esc(r.t)}${r.img?'<br><span class="sub" style="font-size:12px">Touchez la photo pour l\'agrandir</span>':''}</span></div>`};
 const qBlock=s=>{const v=Q.answers[s.id];let ans='';
  if(s.t==='R')ans=`<div class="stars">${[1,2,3,4,5].map(k=>`<button class="${v&&v.n>=k?'on':''}" aria-label="${k} sur 5" onclick="Q.answers[${s.id}]={n:${k}};saveQ(true);render()">★</button>`).join('')}<span class="sub" style="font-size:12px;margin-left:8px">${v&&v.n?['','Décevant','En dessous du standard','Conforme au standard Alfred','Au-dessus du standard','Mémorable'][v.n]:'1 = décevant · 5 = mémorable'}</span></div>`;
  else if(s.t==='X')ans=`<div class="anss"><button class="oui ${v==='oui'?'on':''}" onclick="Q.answers[${s.id}]='oui';saveQ(true);render()"><span class="dot d-gr"></span>Oui, décrivez ⭐️</button><button class="non ${v==='non'?'on':''}" onclick="Q.answers[${s.id}]='non';saveQ(true);render()"><span class="dot d-rd"></span>Non</button></div>${v==='oui'?`<textarea style="margin-top:10px" placeholder="Décrivez le fait" oninput="Q.comments[${s.id}]=this.value;saveQ(true)">${esc(Q.comments[s.id]||'')}</textarea>`:''}`;
  else ans=`<div class="anss">${[['oui','Oui','d-gr'],['non','Non','d-rd'],['na','Sans objet','d-gy']].map(([k,l,d])=>`<button class="${k} ${v===k?'on':''}" onclick="Q.answers[${s.id}]='${k}';saveQ(true);render()"><span class="dot ${d}"></span>${l}</button>`).join('')}</div>${v==='non'?`<textarea style="margin-top:10px" placeholder="${s.t==='C'?'Point critique : décrivez précisément ce que vous avez constaté':'Que manquait-il ? (facultatif)'}" oninput="Q.comments[${s.id}]=this.value;saveQ(true)">${esc(Q.comments[s.id]||'')}</textarea>`:''}`;
  return `<div class="q ${isAnswered(s)?'ok':''}"><span class="num">${++n}</span><div><div class="txt">${esc(qText(s,a.hotel))}</div>${s.t==='C'?'<div class="tags"><span class="pill red">Point critique</span></div>':''}${refTile(s)}${ans}<div class="qtools"><label title="Ajouter une photo">📷<input type="file" accept="image/*" hidden onchange="addPhoto(${s.id},this)"></label>${Q.photos[s.id]?`<img src="${Q.photos[s.id].data||Q.photos[s.id].url}" alt="">`:''}${v!=='non'&&s.t!=='X'?`<button title="Commentaire" onclick="Q.comments[${s.id}]=Q.comments[${s.id}]||' ';render()">💬</button>${Q.comments[s.id]?`<input type="text" style="flex:1;height:32px" placeholder="Commentaire" value="${esc(Q.comments[s.id].trim())}" oninput="Q.comments[${s.id}]=this.value;saveQ(true)">`:''}`:''}</div></div></div>`};
 const buffetBlock=()=>{if(!buffet.length)return '';const groups=[...new Set(buffet.map(s=>s.sub))];const checked=buffet.filter(s=>Q.answers[s.id]==='oui').length;const validated=buffet.every(s=>Q.answers[s.id]);
  return `<div class="sec-head"><span>🧺 Le buffet</span><span class="pill ${validated?'green':''}">${checked} / ${buffet.length} présents</span></div>
  <div class="notice" style="margin-bottom:12px"><b style="font-weight:500">Cochez simplement ce que vous voyez sur le buffet.</b> Tout ce qui n'est pas coché sera compté absent quand vous validerez.</div>
  ${groups.map(gr=>`<div class="bgroup"><div class="bgtitle">${esc(gr.replace('Buffet : ',''))}</div><div class="bitems">${buffet.filter(s=>s.sub===gr).map(s=>{const on=Q.answers[s.id]==='oui';const label=s.q.replace(/^(Le |La |Les |L')/,'').replace(/ (était|étaient)-(il|ils|elle|elles) (présent|présents|présente|présentes|disponible|disponibles) \?$/,'').replace(/ \?$/,'');return `<button class="bitem ${on?'on':''}" onclick="Q.answers[${s.id}]=${on?"'non'":"'oui'"};saveQ(true);render()">${on?'✓ ':''}${esc(label)}</button>`}).join('')}</div></div>`).join('')}
  <div style="display:flex;justify-content:flex-end;margin:8px 0 16px"><button class="btn ${validated?'sec':''}" onclick="validateBuffet()">${validated?'✓ Buffet validé · modifier si besoin':'Je valide : tout le reste est absent'}</button></div>`};
 return `<section class="card"><div class="head" style="border:0;padding-bottom:0;margin-bottom:0"><div><div class="eyebrow">${st.ico} Étape ${i+1} sur ${STAGES.length} · ${st.when}</div><h1 style="font-size:24px;margin-top:4px">${st.title}</h1><p class="sub">${esc(st.desc)}</p></div><button class="btn sec sm" onclick="Q.view='home';render();window.scrollTo(0,0)">‹ Mon parcours</button></div>
 <div class="progrow sticky-prog"><span><b style="font-weight:500;color:var(--navy)">${left?`Il reste ${left} question${left>1?'s':''}`:'Étape complète 🎉'}</b><br>${done} / ${g.length} répondues</span><div class="progress"><i style="width:${g.length?Math.round(done/g.length*100):0}%"></i></div><span class="pill">${Q.saved?'Enregistré à '+Q.saved:'Enregistrement automatique'}</span></div>
 ${st.k==='pdj'?`${subs.filter(x=>x==='Accueil PDJ').map(sub=>`<div class="sec-head"><span>${esc(sub)}</span></div>${others.filter(s=>s.sub===sub).map(qBlock).join('')}`).join('')}${buffetBlock()}${subs.filter(x=>x!=='Accueil PDJ').map(sub=>`<div class="sec-head"><span>${esc(sub)}</span></div>${others.filter(s=>s.sub===sub).map(qBlock).join('')}`).join('')}`
  :subs.map(sub=>`<div class="sec-head"><span>${esc(sub)}</span><span class="pill">${others.filter(s=>s.sub===sub&&isAnswered(s)).length} / ${others.filter(s=>s.sub===sub).length}</span></div>${others.filter(s=>s.sub===sub).map(qBlock).join('')}`).join('')}
 <div class="stickybar"><span style="font-size:13px;color:var(--grey)">${left?`${left} question${left>1?'s':''} restante${left>1?'s':''}`:'Tout est répondu'}</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" onclick="saveQ();Q.view='home';render();window.scrollTo(0,0)">💾 Enregistrer<span class="lg"> et revenir plus tard</span></button><button class="btn" onclick="finishStage('${st.k}','${next?next.k:''}')">${left?'Terminer quand même':'Terminer'}<span class="lg">${left?'':' cette étape'} ${next?'→ '+esc(next.me):'✓'}</span></button></div></div></section>`;
}
function zoomRef(src,t){openModal(`<div class="zoom"><img src="${src}" alt=""><p class="sub" style="text-align:center;margin-top:10px">${t}</p></div>`)}
function validateBuffet(){qList().filter(s=>s.t==='B'&&s.st===Q.stage).forEach(s=>{if(Q.answers[s.id]!=='oui')Q.answers[s.id]='non'});saveQ(true);render();toast('Buffet validé')}
function finishStage(k,nextK){Q.stageDone[k]=true;saveQ(true);Q.view='home';Q.stage=null;toast(STAGE(k).title+' : terminé ✓');render();window.scrollTo(0,0)}
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');const k=Math.min(1,1000/Math.max(img.width,img.height));cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.7))};img.src=r.result};r.readAsDataURL(file)}
function addPhoto(id,inp){const f=inp.files[0];if(!f)return;shrink(f,d=>{Q.photos[id]={data:d};saveQ(true);render()})}
function addDefects(inp){[...inp.files].forEach(f=>shrink(f,d=>{Q.defects.push({data:d,caption:''});saveQ(true);render()}))}
async function uploadAll(){const out=[];for(const p of Q.defects){if(p.url){out.push({id:p.id,url:p.url,caption:p.caption});continue}if(DBS.assets){try{const blob=await (await fetch(p.data)).blob();const up=await DBS.assets.upload(blob);out.push({id:up.id,url:up.url,caption:p.caption});continue}catch(e){}}out.push({caption:p.caption,data:p.data})}
 const ph={};for(const [k,p] of Object.entries(Q.photos)){if(p.url){ph[k]={url:p.url};continue}if(DBS.assets){try{const blob=await (await fetch(p.data)).blob();const up=await DBS.assets.upload(blob);ph[k]={url:up.url};continue}catch(e){}}ph[k]={data:p.data}}return {defects:out,photos:ph}}
async function submitQ(){
 const a=Q.a;const list=qList();const missing=list.filter(s=>!isAnswered(s)).length;
 if(missing>0&&!Q._confirm){Q._confirm=true;openModal(`<h2>Il reste ${missing} question${missing>1?'s':''} sans réponse</h2><p class="sub">Vous pouvez les compléter ou envoyer tel quel : les questions sans réponse seront ignorées.</p><div class="mfoot"><button class="btn sec" onclick="Q._confirm=false;closeAll()">Compléter</button><button class="btn" onclick="closeAll();submitQ()">Envoyer quand même</button></div>`);return}
 const btn=document.getElementById('q-send');if(btn){btn.disabled=true;btn.textContent='Envoi en cours…'}
 const resp={auditId:a.id,format:a.format,hotel:a.hotel,channel:a.channel,from:a.from,to:a.to,official:a.official!==false,client:Q.comments.r0||a.client,answers:Q.answers,comments:Q.comments,photos:{},defects:[],submittedAt:new Date().toISOString()};
 let sent=false;
 if(Q.client){
  if(DBS.db&&DBS.canWrite!==false){try{const up=await uploadAll();resp.defects=up.defects;resp.photos=up.photos;await DBS.db.doc('responses/'+a.id).set(resp);try{await DBS.db.doc('audits/'+a.id).update({status:'te'})}catch(e){}sent=true}catch(e){sent=false}}
  if(!sent)Q.code=btoa(unescape(encodeURIComponent(JSON.stringify({...resp,defects:Q.defects.map(p=>({caption:p.caption})),photos:{}}))));
  Q.done=true;saveQ(true);render();window.scrollTo(0,0);return;
 }
 resp.defects=Q.defects;resp.photos=Q.photos;ingestResponse(resp);a.status='te';
 if(DBS.db){try{const up=await uploadAll();await DBS.db.doc('responses/'+a.id).set({...resp,defects:up.defects,photos:up.photos});await DBS.db.doc('audits/'+a.id).update({status:'te'})}catch(e){}}
 try{localStorage.removeItem(qKey())}catch(e){}Q.a=null;toast('Rapport créé');go('report',{id:'r'+a.id});
}
function ingestResponse(resp){
 if(REPORTS.some(r=>r.id==='r'+resp.auditId))return;
 const sc=computeScore(resp.format,resp.channel,resp.answers||{});
 REPORTS.push({id:'r'+resp.auditId,audit:resp.auditId,format:resp.format,hotel:resp.hotel,channel:resp.channel,from:resp.from,to:resp.to,date:(resp.submittedAt||'').slice(0,10)||'2026-10-26',auditor:resp.client||'Client mystère',official:resp.official!==false,score:sc.global==null?0:sc.global,sc,status:'Non validé',answers:resp.answers||{},comments:resp.comments||{},photos:resp.photos||{},defects:resp.defects||[]});

function performances(){
 const rs=REPORTS.filter(r=>r.official===S.official&&(XF.scope==='group'||r.hotel===S.estab));const sc=rs.length?Math.round(rs.reduce((a,r)=>a+r.score,0)/rs.length):null;
 const MON=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];const W=900,H=280,L=40,R=20,T=20,B=40;const xs=i=>L+i*(W-L-R)/11;const ys=v=>T+(100-v)*(H-T-B)/100;
 const pts=MON.map((m,i)=>{const x=rs.filter(r=>r.date.startsWith('2026-'+String(i+1).padStart(2,'0')));return x.length?[xs(i),ys(Math.round(x.reduce((a,r)=>a+r.score,0)/x.length))]:null});
 const path=pts.filter(Boolean).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Performance moyenne par mois"><rect width="${W}" height="${H}" fill="#fff"/>${[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="#d6dccb" stroke-width=".67"/><text x="${L-6}" y="${ys(v)+4}" font-size="11" fill="#5c6456" text-anchor="end">${v}</text>`).join('')}${MON.map((m,i)=>`<text x="${xs(i)}" y="${H-14}" font-size="12" fill="#5c6456" text-anchor="middle">${m}</text>`).join('')}${path?`<path d="${path}" fill="none" stroke="#2a371f" stroke-width="2.5"/>`:''}${pts.filter(Boolean).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#9db49d" stroke="#2a371f" stroke-width="1.5"/>`).join('')}</svg>`;
 const bySec=SECTIONS.map(sec=>{const v=rs.map(r=>(r.sc||computeScore(r.format,r.channel,r.answers)).secPct[sec]).filter(x=>x!=null);return {n:sec,v:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}});
 const byHotel=HOTELS.map(h=>{const x=REPORTS.filter(r=>r.official===S.official&&r.hotel===h);return {n:h,v:x.length?Math.round(x.reduce((a,r)=>a+r.score,0)/x.length):null,c:x.length}});
 const top=byHotel.filter(x=>x.v!=null).sort((a,b)=>b.v-a.v).slice(0,3);
 return `<section class="card"><div class="head"><div>${crumb('')}<h1>Performances</h1><p class="sub">Vue globale, comparaison et analyse par section</p></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="switch"><button class="${XF.scope==='estab'?'on':''}" onclick="XF.scope='estab';render()">${esc(S.estab)}</button><button class="${XF.scope==='group'?'on':''}" onclick="XF.scope='group';render()">Tous les hôtels</button></div><div class="switch"><button class="${S.official?'on':''}" onclick="S.official=true;render()">🛡 Officiels</button><button class="${!S.official?'on':''}" onclick="S.official=false;render()">⚗ Entraînement</button></div></div></div>
 <div class="kpis"><div><div class="l">∿ Score global</div><div class="v">${sc==null?'n/a':sc+' %'}</div></div><div><div class="l">📋 Nombre d'audits</div><div class="v">${rs.length}</div></div><button class="round dl" aria-label="Exporter" onclick="exportPerf()">⭳</button></div>
 <div class="grid g2" style="margin-top:16px"><div class="kpi"><div class="t">Top 3 hôtels</div><span class="ic">🏆</span><div class="c">${PERIOD_SHORT}</div>${top.length?top.map((t,i)=>`<div class="acard" style="padding:10px 14px"><span>${i+1}. ${esc(t.n)}</span>${scorePill(t.v)}</div>`).join(''):'<p style="margin:12px 0 0"><em class="e">Pas encore de résultat.</em></p>'}</div><div class="kpi"><div class="t">Score par section</div><div class="c">${PERIOD_SHORT}</div>${rs.length?bySec.map(d=>`<div class="hbar"><span style="font-size:13px">${esc(d.n)}</span><div class="bar"><i style="width:${d.v||0}%"></i></div><span style="text-align:right;font-size:13px">${d.v==null?'n/a':d.v+' %'}</span></div>`).join(''):'<p style="margin:12px 0 0"><em class="e">Pas encore de résultat.</em></p>'}</div></div>
 <div class="kpi" style="margin-top:16px"><h2 style="font-size:20px">Performance moyenne ${XF.scope==='group'?'du groupe':"de l'établissement"}</h2><div class="c" style="margin-bottom:12px">${PERIOD_LONG}</div>${chart}</div>
 <div class="kpi" style="margin-top:16px"><h2 style="font-size:20px">Comparaison des hôtels</h2><div class="tblbox" style="margin-top:12px"><table><thead><tr><th>Hôtel</th><th>Audits</th><th>Score</th></tr></thead><tbody>${byHotel.map(h=>`<tr class="row" onclick="setEstab('${esc(h.n)}')"><td>${esc(h.n)}</td><td>${h.c}</td><td>${h.v==null?'<span class="pill">n/a</span>':scorePill(h.v)}</td></tr>`).join('')}</tbody></table></div></div></section>`;
}
function exportPerf(){const csv=['Hôtel;Format;Réservation;Séjour;Auditeur;Type;Statut;Score',...REPORTS.map(r=>[r.hotel,FORMATS[r.format].l,CHANNELS[r.channel].l,fm(r.from),r.auditor,r.official?'officiel':'entraînement',r.status,r.score].join(';'))].join('\n');(navigator.clipboard?navigator.clipboard.writeText(csv):Promise.reject()).then(()=>toast('Données copiées ('+REPORTS.length+' ligne(s))')).catch(()=>toast('Export préparé'))}

/* ===== Paramètres ===== */
const SF={tab:'compte',q:''};
function settings(){
 let body='';
 if(SF.tab==='compte')body=`<div class="grid g2"><div class="field"><label class="lbl" for="pw1">Nouveau mot de passe</label><input type="password" id="pw1" placeholder="Votre nouveau mot de passe"><span style="font-size:13px;color:var(--grey);margin-top:6px">Mot de passe utilisé pour vous connecter</span></div><div class="field"><label class="lbl" for="pw2">Confirmation du mot de passe</label><input type="password" id="pw2" placeholder="Votre confirmation"></div></div><div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="btn" onclick="savePw()">Enregistrer</button></div>`;
 else if(SF.tab==='users'){const us=USERS.filter(u=>!SF.q||(u.name+u.email).toLowerCase().includes(SF.q.toLowerCase()));body=`<h2 style="font-size:20px">Utilisateurs</h2><p class="sub">Administrez les utilisateurs ainsi que leur rôle</p><div class="search" style="margin-top:14px"><input type="search" id="u-q" placeholder="Rechercher…" value="${esc(SF.q)}" oninput="SF.q=this.value;render();document.getElementById('u-q').focus()"></div><div style="display:flex;justify-content:flex-end;margin-top:8px"><span class="pill">${us.length} utilisateur${us.length>1?'s':''} trouvé${us.length>1?'s':''}</span></div>${us.map(u=>`<div class="ucard"><span class="av ${u.me?'me':''}">${u.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</span><div class="inf"><span style="font-weight:500">${esc(u.name)}${u.me?' <span style="font-size:12px;color:var(--grey)">(Vous)</span>':''}</span><small>${esc(u.email)}</small></div><div class="rt"><span class="pill red">${esc(u.role)}</span><span>◷ ${u.last||'Aucune activité'}</span><button class="round" style="width:32px;height:32px" aria-label="Modifier" onclick="toast('Modification (démonstration)')">✎</button></div></div>`).join('')}<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="addUser()">Ajouter un utilisateur</button></div>`}
 else body=`<h2 style="font-size:20px">Configuration</h2><p class="sub">Les trois réglages qui définissent un audit : les hôtels, les modes de réservation et les sections du questionnaire.</p>
  <div class="grid g3" style="margin-top:16px"><div class="kpi"><div class="t">Hôtels <span class="pill">${HOTELS.length}</span></div><div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${HOTELS.map(h=>`<span class="pill">${esc(h)}</span>`).join('')}</div></div><div class="kpi"><div class="t">Modes de réservation <span class="pill">3</span></div><div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${Object.values(CHANNELS).map(c=>`<span class="pill">${c.l}</span>`).join('')}</div></div><div class="kpi"><div class="t">Étapes du parcours client <span class="pill">${STAGES.length}</span></div><div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${STAGES.map(st=>`<span class="pill">${st.ico} ${st.title} · ${STANDARDS.filter(x=>x.st===st.k).length}</span>`).join('')}</div></div></div>
  <div class="kpi" style="margin-top:16px"><div class="t">Barème (questionnaire reclassé)</div><p class="sub">Normale = 1 pt, Essentielle = 3 pts, Critique = 3 pts et, si ratée, statut rouge à traiter sous 15 jours et −3 pts sur la note globale. Buffet : 26 pts partagés entre les ${STANDARDS.filter(x=>x.t==='B').length} produits. Un bonus par section (+1 pt obtenu). Ressenti sur 5 noté à part (indice sur 100). Sans objet = exclu du calcul. Chaque section pèse 20 % de la note.</p><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${SECTIONS.map(s=>`<span class="pill">${esc(s)} · ${STANDARDS.filter(x=>x.sec===s).length} questions</span>`).join('')}</div></div>`;
 return `<section class="card"><div class="head"><div>${crumb('')}<h1>Paramètres</h1><p class="sub">Organisez l'application selon vos besoins</p></div></div><div class="tabs"><button class="${SF.tab==='compte'?'on':''}" onclick="SF.tab='compte';render()">Compte</button><button class="${SF.tab==='users'?'on':''}" onclick="SF.tab='users';render()">Utilisateurs</button><button class="${SF.tab==='conf'?'on':''}" onclick="SF.tab='conf';render()">Configuration</button></div>${body}</section>`;
}
function savePw(){const a=document.getElementById('pw1').value,b=document.getElementById('pw2').value;if(!a){toast('Saisissez un mot de passe');return}if(a!==b){toast('La confirmation ne correspond pas');return}toast('Mot de passe enregistré')}
function addUser(){openModal(`<h2>Ajouter un utilisateur</h2><p class="sub">Une invitation est envoyée par e-mail.</p><div class="grid g2" style="margin-top:16px"><div class="field"><label class="lbl" for="au-n">Nom et prénom</label><input type="text" id="au-n"></div><div class="field"><label class="lbl" for="au-e">E-mail</label><input type="text" id="au-e"></div></div>${selField('Rôle',['Administrateur','Auditeur','Lecteur'],'au-r')}<div class="mfoot" style="justify-content:flex-end"><button class="btn sec" onclick="closeAll()">Annuler</button><button class="btn" onclick="doAddUser()">Ajouter</button></div>`)}
function doAddUser(){const n=document.getElementById('au-n').value.trim();if(!n){toast('Indiquez un nom');return}USERS.push({name:n,email:document.getElementById('au-e').value,role:document.getElementById('au-r').value,last:null});closeAll();toast('Invitation envoyée');render()}

/* ===== Aide ===== */
function help(){
 const rows=[['Lancer un audit client mystère','Librairie','« + Nouvel audit » → format → hôtel → réservation → dates → qui réalise','checklists'],['Envoyer un questionnaire à un client mystère','Librairie ou Planification','à la dernière étape, choisir « Un client mystère externe » : vous obtenez son lien et l\'e-mail de bienvenue prêt à envoyer','checklists'],["Retrouver le lien d'un client",'Planification',"bouton « 🔗 Lien » sur la ligne de l'audit",'planning'],["Lire le questionnaire d'un format",'Librairie','« Voir le questionnaire », puis choisir le mode de réservation','checklists'],['Voir qui audite quoi et quand','Planification','liste ou calendrier, filtre par auditeur et statut','planning'],['Retrouver un rapport','Rapports','filtres format / réservation / statut, puis cliquer la ligne','reports'],["Récupérer les réponses d'un client non invité",'Rapports','« Importer un code de réponses »','reports'],['Suivre les actions correctives',"Plans d'action","depuis un rapport : « + Plan d'action »",'action-plans'],['Comparer les hôtels et les sections','Performances','« Tous les hôtels », score par section','performances'],["Changer d'hôtel",'En-tête','pilule « Compiègne ⌄ » en haut à droite',''],['Ajouter un collaborateur','Paramètres › Utilisateurs','« Ajouter un utilisateur »','settings']];
 return `<section class="card help"><div class="head"><div>${crumb('')}<h1>Où se trouve quoi</h1><p class="sub">Un audit = un séjour complet : un format (Business, Famille, Couple), un hôtel, un mode de réservation, des dates. Le questionnaire est le même pour tous, adapté automatiquement.</p></div></div><div style="overflow-x:auto"><table><thead><tr><th>Je veux…</th><th>Où</th><th>Comment</th></tr></thead><tbody>${rows.map(r=>`<tr ${r[3]?`class="row" onclick="go('${r[3]}')"`:''}><td style="font-weight:500">${r[0]}</td><td>${r[1]}</td><td style="color:var(--grey)">${r[2]}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ===== Stockage partagé et démarrage ===== */
const DBS={db:null,user:null,assets:null,canWrite:null};
const useCap=async n=>{try{return (window.claude&&window.claude.use)?await window.claude.use(n):null}catch(e){return null}};
let render=()=>{setTimeout(persistLocal,0);renderNav();const V={dashboard,checklists,checklist,audit,planning,reports,report,'action-plans':plans,plan,performances,settings,help};document.getElementById('app').innerHTML=(V[S.page]||dashboard)()};
function parseHash(){const mm=(location.hash||'').replace('#','').match(/^cm-(business|famille|couple)-([a-z]+)-(booking|telephone|site)-([a-z0-9]+)$/);return mm?{format:mm[1],hotel:hotelFromSlug(mm[2]),channel:mm[3],id:mm[4]}:null}
function clientMode(){
 const p=parseHash();if(!p)return false;
 document.getElementById('hdr').classList.add('client-hdr');document.querySelector('.brand').onclick=null;
 const a={id:p.id,format:p.format,hotel:p.hotel,channel:p.channel,client:'',from:'',to:'',notes:'',official:true};AUDITS.push(a);loadQ(a,true);
 render=()=>{document.getElementById('app').innerHTML=questionnaire(true)};render();
 (async()=>{DBS.db=await useCap('db');DBS.user=await useCap('user');DBS.assets=await useCap('assets');if(DBS.user){try{DBS.canWrite=await DBS.user.can('data.write')}catch(e){}}
  if(DBS.db){try{const s=await DBS.db.doc('audits/'+p.id).get();if(s.exists)Object.assign(a,s.data());const r=await DBS.db.doc('responses/'+p.id).get();if(r.exists)Q.done=true;else{const d=await DBS.db.doc('drafts/'+p.id).get();if(d.exists&&!Object.keys(Q.answers).length){const x=d.data();Q.answers=x.answers||{};Q.comments=x.comments||{};Q.defects=x.defects||[];Q.stageDone=x.stageDone||{}}}}catch(e){}}
  render()})();
 return true;
}
const LS='alfred-audit-data';
function persistLocal(){if(DBS.db)return;try{localStorage.setItem(LS,JSON.stringify({AUDITS,REPORTS,PLANS}))}catch(e){}}
function restoreLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){AUDITS.push(...(d.AUDITS||[]));REPORTS.push(...(d.REPORTS||[]));PLANS.push(...(d.PLANS||[]))}}catch(e){}}
async function bootPlatform(){
 DBS.db=await useCap('db');DBS.assets=await useCap('assets');if(!DBS.db){render();return}
 try{DBS.db.collection('audits').onSnapshot(snap=>{snap.docs.forEach(d=>{const m=d.data();const i=AUDITS.findIndex(x=>x.id===m.id);if(i<0)AUDITS.push(m);else Object.assign(AUDITS[i],m)});render()},()=>{});
  DBS.db.collection('responses').onSnapshot(snap=>{snap.docs.forEach(d=>ingestResponse(d.data()));render()},()=>{});}catch(e){}
}
if(!clientMode()){restoreLocal();render();bootPlatform()}
</script>
